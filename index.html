      openSheet('<h2>Scheibenrechner</h2><div class="grid2"><label class="field">Gesamtgewicht (kg)<input id="plTot" inputmode="decimal" value="'+fmtIn(x.w)+'"></label><label class="field">Stange<select id="plBar">'+[20,15,10,0].map(b=>'<option value="'+b+'"'+(b===ui.plBar?' selected':'')+'>'+(b?b+' kg':'ohne')+'</option>').join('')+'</select></label></div><div id="plRes">'+plateHtml(num(x.w),ui.plBar)+'</div><p class="small muted" style="margin:0">Langhantel meist 20 kg, Frauen-Hantelstange 15 kg, SZ-Stange ca. 10 kg.</p><button class="btn block" data-act="close">Schließen</button>');break}
    case 'feel':ui.feel=+v;document.querySelectorAll('#feelRow .chip').forEach(c=>c.classList.toggle('on',+c.dataset.v===ui.feel));break;
    case 'finSave':{const m=parseInt($('#finMin').value,10);const f=ui.feel;closeSheet();finishWorkout(m>0?m:1,f);break}
    case 'editSession':editSession(v);break;
    case 'mdSession':{const s=S.sessions.find(x=>x.id===v);if(s)copyText(sessionMd(s),'Kopiert. In Obsidian einfügen.','Für Obsidian');break}
    case 'csv':{const t=csvAll();if(!IN_FRAME){saveFile('zoes-gym-'+today()+'.csv','\ufeff'+t,'text/csv').then(ok=>{if(!ok)textSheet('Tabelle (CSV)','Für Excel oder Numbers.',t)})}else textSheet('Tabelle (CSV)','Kopieren und in eine .csv-Datei einfügen, dann mit Excel oder Numbers öffnen.',t);break}
    case 'mdAll':textSheet('Obsidian (Markdown)','Alle Trainings als Markdown, neuestes zuerst. Einfach in eine Notiz im Vault einfügen.',sorted().reverse().map(sessionMd).join('\n\n---\n\n'));break;
    case 'addSet':{const s=A.entries[ei].sets,l=s[s.length-1]||{w:null,r:null};s.push({w:l.w,r:l.r,done:false});save();render();break}
    case 'delSet':{const u=snapUndo();A.entries[ei].sets.pop();closeSheet();save();render();toast('Satz entfernt',u);break}
    case 'delEx':{const u=snapUndo();A.entries.splice(ei,1);closeSheet();save();render();toast('Übung entfernt',u);break}
    case 'addExAsk':openSheet('<h2>Übung hinzufügen</h2><div class="card">'+activeEx().map(e=>'<button class="listrow" data-act="addEx" data-v="'+e.id+'"><span class="grow"><span class="name">'+esc(e.name)+'</span><br><span class="meta">'+esc(e.muscle)+'</span></span><span class="chev">+</span></button>').join('')+'</div><button class="btn block" data-act="close">Abbrechen</button>');break;
    case 'addEx':A.entries.push(buildEntry(v,null));closeSheet();save();render();break;
    case 'finishAsk':finishAsk();break;
    case 'discardAsk':ask(A.editingId?'Änderungen verwerfen? Das gespeicherte Training bleibt wie vorher.':'Training verwerfen? Die Sätze von heute gehen verloren.','Verwerfen',()=>{const u=snapUndo();S.active=null;timer=null;drawTimer();save();syncWake();go('training');toast('Training verworfen',u)});break;
    case 'timerAdd':if(timer){timer.end+=30000;timer.total+=30;if(!tick)tick=setInterval(drawTimer,250)}break;
    case 'timerStop':timer=null;drawTimer();break;
    case 'ex':ui.exTab=b.dataset.tab||null;exDetail(v);break;
    case 'exTab':ui.exReplace=true;exDetail(ui.exId,v);break;
    case 'exEdit':exEdit(v);break;
    case 'exSave':{const name=$('#fName').value.trim();if(!name){toast('Bitte einen Namen eingeben');break}
      const d={lib:$('#fLib').value||null,name,kind:$('#fKind').value,muscle:$('#fMuscle').value,setting:$('#fSetting').value.trim(),step:num($('#fStep').value)||2.5,note:$('#fNote').value.trim()};
      if(v){Object.assign(exById(v),d)}else{S.exercises.push(Object.assign({id:uid()},d))}
      save();closeSheet();render();toast('Gespeichert');break}
    case 'exDelAsk':ask('Gerät löschen? Es verschwindet auch aus deinen Plänen. Alte Trainings bleiben erhalten.','Löschen',()=>{exById(v).archived=true;S.plans.forEach(p=>p.items=p.items.filter(i=>i.exId!==v));save();render()});break;
    case 'exFilter':ui.exFilter=v;render();break;
    case 'calAdd':calEditSheet(v,null);break;
    case 'calEdit':{const ev=S.planned.find(p=>p.id===v);if(ev)calEditSheet(ev.date,v);break}
    case 'calPick':ui.calDraft.planId=v;document.querySelectorAll('#calPlans .chip').forEach(c=>c.classList.toggle('on',c.dataset.v===v));break;
    case 'calSave':{const d=ui.calDraft,dt=$('#calDate').value||d.date;d.date=dt<today()?today():dt;d.time=$('#calTime').value;d.note=$('#calNote').value.trim();
      if(d.id){Object.assign(S.planned.find(p=>p.id===d.id),d)}else{d.id=uid();S.planned.push(d)}
      ui.calSel=d.date;ui.calMonth=d.date.slice(0,8)+'01';save();closeSheet();render();toast('Eingeplant: '+evName(d)+', '+fmtDate(d.date));break}
    case 'calDel':{const u=JSON.stringify(S.planned);S.planned=S.planned.filter(p=>p.id!==v);save();closeSheet();render();toast('Termin gelöscht',()=>{S.planned=JSON.parse(u);save();render()});break}
    case 'calSkip':S.planned.push({id:uid(),date:v,skip:true});save();render();toast('Für diesen Tag ausgesetzt');break;
    case 'calUnskip':S.planned=S.planned.filter(p=>!(p.date===v&&p.skip));save();render();break;
    case 'calLog':{if(S.active){toast('Beende zuerst das laufende Training');break}const w=S.schedule[pd(v).getDay()];startWorkout(w&&planById(w)?w:'');S.active.date=v;save();render();toast('Trägst nach für '+fmtDate(v));break}
    case 'calNav':{const m=pd(ui.calMonth);ui.calMonth=ymd(new Date(m.getFullYear(),m.getMonth()+(+v),1));render();break}
    case 'calSel':ui.calSel=v;if(v.slice(0,7)!==ui.calMonth.slice(0,7))ui.calMonth=v.slice(0,8)+'01';render();break;
    case 'session':{const s=S.sessions.find(x=>x.id===v);if(s)openSheet('<div class="eyebrow">'+fmtDate(s.date)+'</div>'+sessionCard(s)+'<button class="btn block" data-act="close">Schließen</button>');break}
    case 'delSessionAsk':ask('Dieses Training löschen?','Löschen',()=>{S.sessions=S.sessions.filter(s=>s.id!==v);save();render()});break;
    case 'bodyOpen':bodySheet();break;
    case 'bodySave':{const date=$('#bDate').value||today(),kg=num($('#bKg').value);if(kg!==null&&(kg<25||kg>250)){toast('Bitte Gewicht in kg eingeben');break}
      const e={date};if(kg)e.kg=kg;BM.forEach(([k])=>{const x=num($('#b_'+k).value);if(x&&x>5&&x<250)e[k]=x});
      if(Object.keys(e).length<2){toast('Bitte mindestens einen Wert eintragen');break}
      S.body=S.body.filter(b=>b.date!==date);S.body.push(e);save();render();bodySheet();toast('Gespeichert');break}
    case 'bodyDel':{const u=JSON.stringify(S.body);S.body=S.body.filter(b=>b.date!==v);save();render();bodySheet();toast('Eintrag gelöscht',()=>{S.body=JSON.parse(u);save();render();bodySheet()});break}
    case 'planEdit':planEdit(v);break;
    case 'pMove':{const i=+v,j=i+(+b.dataset.d),it=ui.draft.items;if(j<0||j>=it.length)break;[it[i],it[j]]=[it[j],it[i]];syncDraftName();renderPlanSheet();break}
    case 'pDel':ui.draft.items.splice(+v,1);syncDraftName();renderPlanSheet();break;
    case 'pAdd':{const id=$('#pAdd').value;if(!id)break;ui.draft.items.push({exId:id,sets:3,repMin:8,repMax:12,rest:S.settings.rest});syncDraftName();renderPlanSheet();break}
    case 'pWarmSuggest':syncDraftName();ui.draft.warmup=defaultWarm(ui.draft);renderPlanSheet();break;
    case 'pWarmDel':syncDraftName();ui.draft.warmup.splice(+v,1);renderPlanSheet();break;
    case 'pWarmAdd':{const id=$('#pWarmAdd').value;if(!id)break;syncDraftName();const e=exById(id);ui.draft.warmup.push({exId:id,val:warmDef(e)});renderPlanSheet();break}
    case 'pSave':{syncDraftName();const p=ui.draft;if(!p.name.trim()){toast('Bitte einen Namen eingeben');break}
      if(p.id){S.plans[S.plans.findIndex(x=>x.id===p.id)]=p}else{p.id=uid();S.plans.push(p)}save();closeSheet();render();toast('Plan gespeichert');break}
    case 'planDelAsk':ask('Plan löschen?','Löschen',()=>{S.plans=S.plans.filter(p=>p.id!==v);for(const k in S.schedule)if(S.schedule[k]===v)delete S.schedule[k];save();render()});break;
    case 'clearSampleAsk':ask('Beispiel-Trainings und Körpergewicht löschen? Geräte und Pläne bleiben.','Löschen',()=>{S.sessions=[];S.body=[];S.sample=false;save();go('heute');toast('Bereit für deine Daten')});break;
    case 'resetAsk':ask('Alles löschen und Beispieldaten neu laden?','Zurücksetzen',()=>{S=makeSample();migrate();applyTheme();save();go('heute')});break;
    case 'export':saveFile('zoes-gym-backup-'+today()+'.json',JSON.stringify(S,null,1),'application/json').then(ok=>{if(ok){markBackup();render();toast('Backup gespeichert')}else toast('Nicht gespeichert. Nutze „Als Text zeigen“.')});break;
    case 'exportText':textSheet('Backup als Text','Kopieren und z. B. in deine Notizen, iCloud oder Obsidian legen. Über „Backup-Text einfügen“ spielst du es wieder ein.',JSON.stringify(S),true);break;
    case 'copy':{const t=$('#expTxt'),isB=v==='backup';const ok=()=>{if(isB){markBackup()}toast('Kopiert')};try{navigator.clipboard.writeText(t.value).then(ok,()=>{t.focus();t.select();toast('Markiert, jetzt kopieren')})}catch(e){t.focus();t.select();toast('Markiert, jetzt kopieren')}break}
    case 'importText':openSheet('<h2>Backup einfügen</h2><textarea id="impTxt" placeholder="Backup-Text hier einfügen"></textarea><div class="grid2"><button class="btn" data-act="close">Abbrechen</button><button class="btn primary" data-act="doImport">Importieren</button></div>');break;
    case 'doImport':importJSON($('#impTxt').value);break;
  }
});
function syncDraftName(){const n=$('#pName');if(n&&ui.draft)ui.draft.name=n.value}
function importJSON(txt){
  try{const d=JSON.parse(txt);if(!d||d.v!==1||!Array.isArray(d.sessions)||!Array.isArray(d.exercises))throw 0;
    ask('Backup mit '+d.sessions.length+' Trainings laden? Die aktuellen Daten werden ersetzt.','Laden',()=>{S=d;migrate();applyTheme();save();go('heute');toast('Backup geladen')})}
  catch(e){toast('Das ist kein gültiges Backup')}
}
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.dataset.wf&&S.active&&S.active.warmup){const w=S.active.warmup[+t.dataset.wi];if(w){w[t.dataset.wf]=t.dataset.wf==='val'?num(t.value):t.value;save()}}
  else if(t.dataset.f&&S.active){const x=S.active.entries[+t.dataset.ei].sets[+t.dataset.si];x[t.dataset.f]=num(t.value);save()}
  else if(t.id==='actNote'&&S.active){S.active.note=t.value;save()}
  else if(t.id==='exQ'){ui.exQuery=t.value;$('#exList').innerHTML=exListHtml()}
  else if(t.dataset.exnote){const ex=exById(t.dataset.exnote);if(ex){ex.note=t.value;save()}}
  else if(t.id==='plTot'||t.id==='plBar'){ui.plBar=+$('#plBar').value;$('#plRes').innerHTML=plateHtml(num($('#plTot').value),ui.plBar)}
  else if(t.dataset.packitem){const pk=packById(ui.packId),it=pk&&pk.items.find(i=>i.id===t.dataset.packitem);if(it&&t.value.trim()){it.t=t.value;save()}}
  else if(t.id==='packName'){const pk=packById(ui.packId);if(pk&&t.value.trim()){pk.name=t.value.trim();save();const c=$('#sheet .chip.on[data-act=packOpen]');if(c)c.textContent=pk.name}}
  else if(t.dataset.wpi!==undefined&&ui.draft){const v=num(t.value);if(v>0)ui.draft.warmup[+t.dataset.wpi].val=v}
  else if(t.dataset.pf&&ui.draft){const v=parseInt(t.value,10);if(!isNaN(v))ui.draft.items[+t.dataset.pi][t.dataset.pf]=v}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset.sched!==undefined){if(t.value)S.schedule[t.dataset.sched]=t.value;else delete S.schedule[t.dataset.sched];save();toast('Gespeichert')}
  else if(t.id==='setGoal'){const v=parseInt(t.value,10);if(v>0&&v<15){S.settings.goal=v;save();toast('Gespeichert')}}
  else if(t.id==='setRest'){const v=parseInt(t.value,10);if(v>=10&&v<=600){S.settings.rest=v;save();toast('Gespeichert')}}
  else if(t.id==='actDate'&&S.active&&t.value){S.active.date=t.value>today()?today():t.value;save();render()}
  else if(t.id==='fLib'&&t.value){const l=libById(t.value);if(l){if(!$('#fName').value.trim()||LIB.some(x=>x.name===$('#fName').value))$('#fName').value=l.name;$('#fKind').value=l.kind;$('#fMuscle').value=l.muscle}}
  else if(t.id==='setBodyHome'){S.settings.bodyHome=t.checked;save();render();toast(t.checked?'Wird auf Heute angezeigt':'Auf Heute ausgeblendet. Du findest es unter Plan.')}
  else if(t.id==='setSound'){S.settings.sound=t.checked;save();toast('Gespeichert')}
  else if(t.id==='plBar'){ui.plBar=+t.value;$('#plRes').innerHTML=plateHtml(num($('#plTot').value),ui.plBar)}
  else if(t.id==='importFile'&&t.files[0]){const r=new FileReader();r.onload=()=>importJSON(r.result);r.readAsText(t.files[0]);t.value=''}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='packAddIn'){ev.preventDefault();const bt=document.querySelector('[data-act=packAdd]');if(bt)bt.click();return}if(ev.key==='Escape'&&!$('#scrim').hidden)closeSheet()});
$('#scrim').addEventListener('click',ev=>{if(ev.target.id==='scrim')closeSheet()});
function applyTheme(){const t=S.settings&&S.settings.theme;if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme}
function migrate(){
  if(!S.warmSeeded){LIB.filter(l=>l.warm).forEach(l=>{if(!S.exercises.some(e=>e.lib===l.id)){const id=S.exercises.some(e=>e.id===l.id)?uid():l.id;S.exercises.push({id,name:l.name,kind:l.kind,muscle:l.muscle,setting:'',step:1,note:'',lib:l.id})}});S.warmSeeded=true}
  (S.plans||[]).forEach(p=>{if(!Array.isArray(p.warmup))p.warmup=defaultWarm(p)});
  if(!Array.isArray(S.packs))S.packs=defaultPacks();(S.exercises||[]).forEach(e=>{if(e.lib===undefined){const l=libById(e.id)||libMatch(e.name);e.lib=l?l.id:null}});S.settings=Object.assign({goal:3,rest:90,sound:true,lastBackup:null,bodyHome:true},S.settings);S.planned=S.planned||[];S.body=S.body||[]}
migrate();applyTheme();
try{window.history.replaceState({tab:ui.tab,ov:false,sheet:0},'')}catch(e){}
render();syncWake();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){syncWake();if(timer)drawTimer()}});
setInterval(()=>{const el=document.getElementById('elapsed');if(el)el.textContent=elapsedTxt()},20000);
})();
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}
</script>
</body>
</html>
