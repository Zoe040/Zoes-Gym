<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A1640">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zoes Gym">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<meta charset="utf-8">
<title>Zoes Gym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: eine App-Spalte (max 720px) mit fester Tab-Leiste unten, Karten nur für Dinge, die man antippt.
   Farben: dunkles Lila für Aktionen (dominant), Magenta nur für Daten und Rekorde, Neutraltöne leicht lila getönt. */
:root{
  --bg:#F4F1F8; --surface:#FFFFFF; --sunk:#EAE5F0; --ink:#1E1726; --muted:#625B6E; --line:#DCD5E5;
  --accent:#5E2A9E; --accent-ink:#FFFFFF; --plate:#B0307A; --plate-ink:#FFFFFF; --good:#116B43; --warn:#8A5300; --danger:#B3261E;
  --hero-bg:#2A1640; --hero-bg2:#43226B; --hero-fg:#F3EEF9; --disc:#9F6BF0;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#130F19; --surface:#1C1724; --sunk:#251F2F; --ink:#EDE8F3; --muted:#A39BB0; --line:#322A3D;
  --accent:#B794F4; --accent-ink:#1A0F2A; --plate:#F07AB8; --plate-ink:#24081A; --good:#3CC487; --warn:#F0A43A; --danger:#FF8A80;
  --hero-bg:#2B1C3F; --hero-bg2:#3C2659; --hero-fg:#EDE8F3; --disc:#9F6BF0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#130F19; --surface:#1C1724; --sunk:#251F2F; --ink:#EDE8F3; --muted:#A39BB0; --line:#322A3D;
  --accent:#B794F4; --accent-ink:#1A0F2A; --plate:#F07AB8; --plate-ink:#24081A; --good:#3CC487; --warn:#F0A43A; --danger:#FF8A80;
  --hero-bg:#2B1C3F; --hero-bg2:#3C2659; --hero-fg:#EDE8F3; --disc:#9F6BF0; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:2.1rem;line-height:1}
h2{font-size:1.35rem;text-transform:uppercase;letter-spacing:.04em}
h3{font-size:1.2rem}
.section>h2,.section>.spread>h2{font-family:var(--body);font-size:.78rem;font-weight:600;letter-spacing:.09em;color:var(--muted)}
h1.greet{font-family:var(--body);font-size:1.15rem;font-weight:600;letter-spacing:0}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:12px}
.section{display:flex;flex-direction:column;gap:12px;margin-top:32px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:8px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.badge.sample{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.badge.pr{background:var(--plate);color:var(--plate-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.block{width:100%}
.btn.sm{min-height:34px;padding:0 12px;font-size:.9rem;border-radius:10px}
.btn:focus-visible,.tab:focus-visible,.daycell:focus-visible,.listrow:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:16px}
button,label.btn{touch-action:manipulation}
label.field,div.field{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--muted);font-weight:600;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

/* Hero: heutiges Training */
/* Hero mit leichtem Verlauf, Scheibe in hellem Violett */
.hero{background:linear-gradient(135deg,var(--hero-bg),var(--hero-bg2));color:var(--hero-fg);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero .eyebrow{color:color-mix(in srgb,var(--hero-fg) 70%,transparent)}
.hero h2{font-size:2.6rem;line-height:1;text-transform:none;letter-spacing:0}
.hero .art{position:absolute;right:16px;top:50%;transform:translateY(-50%);pointer-events:none}
.hero.has-art .eyebrow,.hero.has-art h2,.hero.has-art .exlist{max-width:calc(100% - 130px)}
.bodymap{display:flex;gap:6px;justify-content:center}
.bodymap figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.bodymap .fig{width:96px;height:auto}
.bodymap figcaption{font-size:.75rem;color:var(--muted);font-weight:600}
.bodymap polygon{stroke:var(--surface);stroke-width:.6}
.bodymap .b{fill:color-mix(in srgb,var(--ink) 17%,var(--surface))}
.bodymap .n{fill:color-mix(in srgb,var(--ink) 22%,var(--surface))}
.bodymap .p{fill:var(--accent)}
.bodymap .s{fill:color-mix(in srgb,var(--accent) 38%,var(--surface))}
.bodymap.onhero .fig{width:52px}
.bodymap.onhero polygon{stroke:var(--hero-bg)}
.bodymap.onhero .b,.bodymap.onhero .n{fill:color-mix(in srgb,var(--hero-fg) 20%,var(--hero-bg))}
.bodymap.onhero .p{fill:var(--disc)}
.ring{width:112px;height:112px}
.ring circle{fill:none;stroke-width:9}
.ring .trk{stroke:color-mix(in srgb,var(--hero-fg) 18%,transparent)}
.ring .val{stroke:var(--disc);stroke-linecap:round}
.ring text{fill:var(--hero-fg);text-anchor:middle}
.ring .rn{font:700 30px var(--display);dominant-baseline:middle}
.ring .rt{font:600 9px var(--body);fill:color-mix(in srgb,var(--hero-fg) 75%,transparent)}
.mlegend{display:flex;gap:16px;justify-content:center;font-size:.8rem;color:var(--muted)}
.mlegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.shots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shots figure{margin:0;display:flex;flex-direction:column;gap:4px}
.shots img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:var(--sunk);display:block}
.shots figcaption{font-size:.8rem;color:var(--muted);font-weight:600}
@media (max-width:360px){.hero .art{display:none}.hero.has-art .eyebrow,.hero.has-art h2,.hero.has-art .exlist{max-width:none}}
.hero .btn.primary{background:var(--hero-fg);border-color:var(--hero-fg);color:var(--hero-bg)}
.hero .exlist{font-size:.95rem;color:color-mix(in srgb,var(--hero-fg) 78%,transparent)}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;min-width:0}
.stat .v{font-family:var(--display);font-size:1.9rem;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.stat .l{font-size:.78rem;color:var(--muted)}
.weekdots{display:flex;gap:6px}
.weekdots span{width:12px;height:12px;border-radius:50%;border:2px solid var(--plate)}
.weekdots span.on{background:var(--plate)}

.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:12px var(--body)}
.chart .lbl{fill:var(--ink);font-family:var(--display);font-weight:700;font-size:14px}

.listrow{display:flex;align-items:center;gap:12px;min-width:0;padding:12px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;cursor:pointer}
.listrow:last-child{border-bottom:0}
.listrow .grow{flex:1;min-width:0;display:block}
.listrow .name{font-weight:600}
.listrow .meta{display:block;font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.listrow .right{text-align:right;font-family:var(--display);font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums}
.chev{color:var(--muted)}
.trend{font-size:.7rem;vertical-align:middle;margin-left:2px}
.tag{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--sunk);color:var(--muted)}

/* Logger */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.ex.done{border-color:color-mix(in srgb,var(--good) 55%,var(--line))}
.hint{font-size:.875rem;color:var(--muted);background:var(--sunk);border-radius:10px;padding:8px 12px}
.hint b{color:var(--ink)}
.sets{width:100%;border-collapse:collapse}
.sets th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:0 4px 4px;font-weight:600}
.sets td{padding:4px}
.sets td:first-child{width:36px;font-family:var(--display);font-weight:700;font-size:1.1rem;color:var(--muted);text-align:center}
.sets input{text-align:center;font-family:var(--display);font-size:1.25rem;font-weight:700;padding:6px;font-variant-numeric:tabular-nums}
.sets tr.ok input{background:color-mix(in srgb,var(--good) 14%,var(--sunk));border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.setno{background:none;border:0;font:inherit;color:inherit;width:100%;min-height:44px;cursor:pointer;border-radius:8px}
tr.wu .setno{color:var(--warn)}
tr.wu input{opacity:.7}
body.timing .wrap{padding-bottom:calc(170px + env(safe-area-inset-bottom,0px))}
.mrow{display:grid;grid-template-columns:84px 1fr 28px;gap:10px;align-items:center;font-size:.9rem}
.mrow b{font-family:var(--display);font-size:1.15rem;text-align:right;font-variant-numeric:tabular-nums}
.mtrack{position:relative;height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.mtrack .band{position:absolute;top:0;bottom:0;left:41.7%;width:41.7%;background:color-mix(in srgb,var(--good) 22%,transparent)}
.mtrack .fill{position:absolute;top:2px;bottom:2px;left:0;border-radius:4px;background:var(--plate)}
.platebar{display:flex;align-items:center;gap:3px;min-height:110px;overflow-x:auto;padding:8px 0}
.platebar .shaft{width:44px;height:14px;border-radius:3px;background:var(--muted);flex:none}
.platebar .pl{flex:none;width:22px;border-radius:4px;border:1px solid rgba(0,0,0,.25);display:grid;place-items:center;font:700 .7rem var(--display);color:#141922;writing-mode:vertical-rl}
.feel{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.feel .chip{padding:0 4px;font-size:.8rem}
.warnbox{border-color:var(--warn)}
.check{width:48px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);cursor:pointer;display:grid;place-items:center}
tr.ok .check{background:var(--good);border-color:var(--good);color:var(--surface)}
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(688px,calc(100% - 32px));background:var(--hero-bg);color:var(--hero-fg);border-radius:14px;padding:8px 16px;display:flex;align-items:center;gap:12px;z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.livebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));width:min(688px,calc(100% - 32px));background:var(--hero-bg);color:var(--hero-fg);border:0;border-radius:14px;padding:10px 16px;display:flex;align-items:center;gap:12px;z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.25);cursor:pointer;text-align:left;min-height:52px}
.livebar .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.livebar .pulse{width:10px;height:10px;border-radius:50%;background:var(--plate);flex:none}
.livebar .pulse.p{background:transparent;border:2px solid var(--hero-fg)}
.livebar .go{font-weight:700;flex:none}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 -4px}
.navrow .navbtn{padding-left:0}
.btn.paused{border-color:var(--accent);color:var(--accent)}
.pausebox{border-color:var(--accent);gap:12px}
.timer .t{font-family:var(--display);font-size:1.8rem;font-weight:700;font-variant-numeric:tabular-nums;min-width:70px}
.timer .bar{flex:1;height:6px;border-radius:3px;background:color-mix(in srgb,var(--hero-fg) 22%,transparent);overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--plate)}
.timer button{background:transparent;border:1px solid color-mix(in srgb,var(--hero-fg) 35%,transparent);color:var(--hero-fg);border-radius:9px;min-height:34px;padding:0 10px;cursor:pointer}

/* Kalender */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:.72rem;color:var(--muted);font-weight:600;padding-bottom:4px}
.daycell{aspect-ratio:1/1;max-width:100%;border-radius:10px;border:1px solid transparent;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-family:var(--display);font-size:1.05rem;font-weight:600;font-variant-numeric:tabular-nums;padding:0}
.daycell.out{opacity:.35}
.daycell.today{border-color:var(--accent);border-width:2px}
.daycell.sel{background:var(--accent);color:var(--accent-ink)}
.daycell.sel .dot.plan{border-color:var(--accent-ink)}
.daycell.sel .dot.done{background:var(--accent-ink)}
.daycell .dot{width:7px;height:7px;border-radius:50%}
.daycell .dot.done{background:var(--plate)}
.daycell .dot.plan{border:1.5px solid var(--muted)}
.daycell .dot.none{visibility:hidden}
.evrow{display:flex;align-items:center;gap:8px;min-width:0;padding-bottom:12px;border-bottom:1px solid var(--line)}
.evrow .grow{flex:1;min-width:0}
.evrow .meta{display:block;font-size:.82rem;color:var(--muted)}
.sheet-h{text-transform:none;letter-spacing:0;font-size:1.6rem}
.bodyrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;min-width:0}
.bodyrow .grow{flex:1;min-width:0;display:block}
.bodyrow .meta{display:block;font-size:.82rem;color:var(--muted)}
.bodyrow .big{font-size:2rem;font-weight:700;line-height:1.05}
.bodyrow .unit{font-size:1rem;color:var(--muted)}
.bodyrow .go{color:var(--accent);font-weight:600;flex:none}
.bodyrow svg{flex:none}
details summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg.seg3{grid-template-columns:repeat(3,1fr)}
.seg button{min-height:40px;border:0;border-radius:9px;background:transparent;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,10,30,.12)}
.mchip{display:inline-block;font-size:.85rem;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--sunk);color:var(--ink)}
.mchip.main{background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.steps,.ticks,.crosses{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px}
.ticks,.crosses{list-style:none;padding-left:0}
.ticks li,.crosses li{position:relative;padding-left:26px}
.ticks li::before{content:"✓";position:absolute;left:4px;color:var(--good);font-weight:700}
.crosses li::before{content:"✕";position:absolute;left:4px;color:var(--danger);font-weight:700}
.variant{display:flex;flex-direction:column;gap:2px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.variant:last-child{border-bottom:0;padding-bottom:0}
.variant span{color:var(--muted);font-size:.92rem}
.linkbtn{background:none;border:0;padding:6px 0 0;color:var(--accent);font-weight:600;cursor:pointer;font-size:.9rem;min-height:32px}
a{color:var(--accent)}
.ex.warm{gap:8px}
.wrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.wrow .wname{min-width:0;flex:1 1 140px}
.wrow .wname .meta{display:block;font-size:.82rem;color:var(--muted)}
.wrow .linkbtn{padding:0;min-height:24px;font-size:.82rem}
.wins{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
.wl{display:flex;align-items:center;gap:4px;font-size:.8rem;color:var(--muted);font-weight:600}
.wl input{width:58px;text-align:center;font-family:var(--display);font-size:1.15rem;font-weight:700;padding:6px}
.wl.sm input{width:52px;min-height:36px;font-size:1rem}
.wlev{width:96px;font-size:.85rem;padding:6px 8px}
.wrow.ok .wl input,.wrow.ok .wlev{background:color-mix(in srgb,var(--good) 14%,var(--sunk));border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.wrow.ok .check{background:var(--good);border-color:var(--good);color:var(--surface)}
.wdel{padding:0 8px}
.pbar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0 4px}.pbar i{display:block;height:100%;background:var(--accent);transition:width .2s}
#packHome .chips{margin-bottom:10px;flex-wrap:wrap}
.packhead{display:flex;align-items:center;gap:10px;flex:1;min-width:0;min-height:44px;padding:0;border:0;background:none;color:inherit;text-align:left;cursor:pointer}
.packhead h2{margin:0;font-family:var(--body);font-size:.78rem;font-weight:600;letter-spacing:.09em;color:var(--muted);flex:none}.packhead .packsum{flex:1;min-width:0;font-size:.9rem;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.packhead .chev{width:20px;height:20px;flex:none;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.packhead[aria-expanded=false] .chev{transform:rotate(-90deg)}
.packhead:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.packrow{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:6px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;font-size:1rem}
.packrow:last-child{border-bottom:0}
.packrow .box{width:28px;height:28px;flex:none;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.packrow .box svg{width:18px;height:18px}
.packrow.ok .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.packrow.ok span:last-child{color:var(--muted);text-decoration:line-through}
.packrow:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.legend{display:flex;gap:16px;font-size:.82rem;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.9rem;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wday{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;min-width:0}
.wday b{font-family:var(--display);font-size:1.05rem}
.wday i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line)}
.wday.train i{background:var(--plate);border-color:var(--plate)}
.wday.train{background:color-mix(in srgb,var(--plate) 12%,var(--surface));border-color:color-mix(in srgb,var(--plate) 45%,var(--line))}
.wday.sel{outline:2px solid var(--accent);outline-offset:1px}
.wday:focus-visible{outline:3px solid var(--plate);outline-offset:2px}

/* Tab-Leiste */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:30}
.tabbar .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:.7rem;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
.tab.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tab.on svg{stroke-width:2.3}
.tab .live{position:absolute;top:6px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--plate)}
.exmenu{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:transparent;font-size:1.3rem;line-height:1;cursor:pointer;flex:none;color:var(--ink)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(8,10,14,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:min(720px,100%);max-height:92%;overflow:auto;border-radius:20px 20px 0 0;box-shadow:0 -4px 8px rgba(8,10,14,.08),0 -16px 40px rgba(8,10,14,.2);padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheetbar{position:sticky;top:-16px;margin:-16px -16px 0;padding:8px 8px 4px;display:flex;justify-content:space-between;align-items:center;background:var(--bg);z-index:2}
.navbtn{display:inline-flex;align-items:center;gap:2px;min-height:44px;min-width:44px;justify-content:center;padding:0 10px 0 4px;border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;border-radius:10px}
.navbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.navbtn.x{color:var(--muted);padding:0}
.navbtn:focus-visible{outline:3px solid var(--plate);outline-offset:2px}
.toast button{background:none;border:0;color:inherit;font:inherit;text-decoration:underline;text-underline-offset:3px;margin-left:14px;padding:6px 0;cursor:pointer}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.empty{text-align:center;padding:24px 12px;color:var(--muted)}
.tablewrap{overflow-x:auto}
.hist{width:100%;border-collapse:collapse;font-size:.9rem}
.hist td,.hist th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.hist th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.hist td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
@media (min-width:900px){.dash2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px}.dash2 .section{margin-top:0}}
@media (max-width:380px){.stat .v{font-size:1.5rem}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cal{grid-template-columns:repeat(7,minmax(0,1fr))}
.tab{min-width:0;overflow:hidden}
@media (max-width:340px){.bodyrow svg{display:none}.evrow{flex-wrap:wrap}.seg button{font-size:.78rem;min-width:0;overflow:hidden;text-overflow:ellipsis}.top,.spread{flex-wrap:wrap}.stats,.grid2{grid-template-columns:minmax(0,1fr)}.cal{gap:2px}.daycell{font-size:.85rem;border-radius:6px}.tab{font-size:.6rem}.tab svg{width:20px;height:20px}.mrow{grid-template-columns:64px minmax(0,1fr) 24px}.week{gap:2px}.wday b{font-size:.9rem}.hero h2{font-size:2rem}.chips{flex-wrap:wrap}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}

/* ---------- Übungsbibliothek: Ausführung, Muskeln, Varianten (Quellen je Übung) ---------- */
const LIB=/*LIB*/[{"id":"beinpresse","name":"Beinpresse","aliases":["Leg Press","45-Grad-Beinpresse"],"kind":"Maschine","muscle":"Beine","primary":["Oberschenkelvorderseite (Quadrizeps)","Großer Gesäßmuskel (Gluteus maximus)"],"secondary":["Adduktoren (Oberschenkelinnenseite)","Beinbeuger (Hamstrings)","Waden"],"setup":"Stell die Rückenlehne so ein, dass Po und unterer Rücken fest anliegen und die Knie unten etwa 90 Grad gebeugt sind.","steps":["Setz dich hin, drück Rücken und Kopf an die Lehne und stell die Füße hüftbreit mittig auf die Plattform.","Spann den Bauch an, greif die Griffe und löse die Sicherung.","Lass die Plattform langsam kommen, bis die Knie etwa 90 Grad gebeugt sind.","Drück die Plattform über die ganze Fußsohle weg, ohne die Knie ganz durchzustrecken."],"cues":["Knie zeigen in Richtung Zehen.","Po bleibt unten auf dem Sitz.","Oben Knie nicht einrasten lassen."],"mistakes":["Knie fallen beim Drücken nach innen.","Zu tief gehen, bis sich das Becken abrollt und der Po vom Sitz hebt.","Knie oben komplett durchstrecken oder unten abfedern."],"variants":[{"name":"Füße hoch auf der Plattform","effect":"Die Hüfte arbeitet mehr, darum tragen Po und Beinbeuger vermutlich etwas mehr bei; die Studienlage dazu ist aber uneinheitlich."},{"name":"Füße tief auf der Plattform","effect":"Das Knie beugt sich stärker, das betont die Oberschenkelvorderseite etwas mehr."},{"name":"Breiter Stand, Zehen leicht nach außen","effect":"Die Oberschenkelinnenseite (Adduktoren) wird etwas mehr mitgenommen; Belege dafür sind dünn."},{"name":"Tiefer gehen (mehr Kniebeugung)","effect":"Die Oberschenkelvorderseite ist in tieferen Winkeln aktiver, solange der Po auf dem Sitz bleibt."}],"sources":["https://www.nasm.org/resource-center/exercise-library/leg-press"],"studies":3,"img":1},{"id":"hipthrust","name":"Hip Thrust Maschine","aliases":["Hip Thrust","Glute Drive"],"kind":"Maschine","muscle":"Po","primary":["Großer Gesäßmuskel (Gluteus maximus)"],"secondary":["Beinbeuger (Hamstrings)","Oberschenkelvorderseite (Quadrizeps)","Rückenstrecker","Mittlerer Gesäßmuskel"],"setup":"Stell das Polster so ein, dass der Gurt oder das Polster auf dem Hüftknochen liegt und die Schulterblätter an der Rückenlehne anliegen.","steps":["Setz dich mit dem oberen Rücken an die Lehne und leg das Polster quer über die Hüfte.","Stell die Füße hüftbreit so hin, dass die Schienbeine oben etwa senkrecht stehen.","Drück über die Fersen die Hüfte nach oben, bis Knie, Hüfte und Schultern eine Linie bilden.","Halte oben kurz und spann den Po fest an.","Senk die Hüfte langsam ab, ohne das Gewicht abzulegen."],"cues":["Kinn leicht zur Brust, Blick nach vorn.","Rippen unten lassen, nicht ins Hohlkreuz drücken.","Oben kurz halten, dort arbeitet der Po am stärksten."],"mistakes":["Oben ins Hohlkreuz gehen statt die Hüfte zu strecken.","Füße zu weit weg oder zu nah, sodass oben keine 90 Grad im Knie entstehen.","Schwung holen und oben nicht halten."],"variants":[{"name":"Füße weiter vorn (Knie offener)","effect":"Die Beinbeuger arbeiten etwas mehr mit, der Po etwas weniger."},{"name":"Füße näher am Po (Knie stärker gebeugt)","effect":"Die Oberschenkelvorderseite arbeitet etwas mehr; mit etwa 90 Grad im Knie oben bleibt der Fokus gut auf dem Po."},{"name":"Knie leicht nach außen drücken","effect":"Kann den Po etwas mehr betonen; die Daten dazu sind dünn."},{"name":"Einbeinig","effect":"Mehr Arbeit für den Po des Standbeins und mehr Stabilisierung durch den mittleren Gesäßmuskel."}],"sources":["https://www.nsca.com/contentassets/f921c5b3fe4142db964a943d3554b324/ptq-10.4.4-program-design-considerations-for-optimal-strength-hypertophy-glute-mucsles.pdf"],"studies":5,"img":2},{"id":"rdl","name":"Rumänisches Kreuzheben","aliases":["Romanian Deadlift","RDL"],"kind":"Freihantel","muscle":"Beine","primary":["Beinbeuger (Hamstrings)","Großer Gesäßmuskel (Gluteus maximus)"],"secondary":["Rückenstrecker","Adduktoren","Trapezmuskel","Unterarme (Griff)"],"setup":"Stell dich hüftbreit hin, Kurzhanteln oder Langhantel vor den Oberschenkeln, Knie leicht gebeugt.","steps":["Spann den Bauch an und zieh die Schultern leicht nach hinten unten.","Schieb die Hüfte nach hinten und lass die Hanteln nah an den Beinen nach unten gleiten.","Geh so weit runter, bis du hinten im Oberschenkel eine deutliche Dehnung spürst und der Rücken noch gerade ist.","Schieb die Hüfte nach vorn und komm in den aufrechten Stand zurück."],"cues":["Hüfte nach hinten, nicht nach unten.","Gewicht nah am Körper.","Rücken lang und gerade."],"mistakes":["Rücken wird rund, um tiefer zu kommen.","Knie zu stark beugen, sodass es eine Kniebeuge wird.","Hanteln wandern weit vom Körper weg."],"variants":[{"name":"Einbeinig","effect":"Sehr hohe Kraft im großen und mittleren Gesäßmuskel des Standbeins, dazu viel Gleichgewichtsarbeit."},{"name":"Knie etwas mehr gebeugt","effect":"Der Po trägt etwas mehr bei, die Beinbeuger werden etwas weniger gedehnt."},{"name":"Tiefer gehen bei geradem Rücken","effect":"Mehr Dehnung der Beinbeuger; Training in gedehnter Position fördert dort vermutlich das Wachstum."}],"sources":["https://www.nasm.org/resource-center/exercise-library/dumbbell-romanian-deadlift"],"studies":4,"img":1},{"id":"beinbeuger","name":"Beinbeuger sitzend","aliases":["Seated Leg Curl"],"kind":"Maschine","muscle":"Beine","primary":["Beinbeuger (Hamstrings)"],"secondary":["Wadenmuskel (Gastrocnemius)"],"setup":"Richte die Rückenlehne so ein, dass die Kniegelenke auf Höhe der Drehachse sind, und leg das Polster knapp über die Fersen.","steps":["Setz dich mit dem Rücken fest an die Lehne und klapp das Oberschenkelpolster fest auf die Beine.","Halte dich an den Griffen fest und spann den Bauch an.","Zieh die Fersen kontrolliert Richtung Po.","Lass die Beine langsam zurück, bis sie fast gestreckt sind."],"cues":["Langsam zurück, nicht fallen lassen.","Hüfte bleibt ruhig im Sitz.","Ganze Bewegung nutzen."],"mistakes":["Zu viel Gewicht, sodass du ruckst.","Nur halbe Wiederholungen.","Mit der Hüfte
