oben lassen."],"mistakes":["Weit nach hinten lehnen und mit Schwung ziehen.","Stange hinter den Nacken ziehen.","Schultern ziehen hoch Richtung Ohren."],"variants":[{"name":"Enger Griff / V-Griff","effect":"Der Latissimus arbeitet etwa gleich stark; viele schaffen etwas mehr Gewicht."},{"name":"Untergriff","effect":"Der Latissimus war in einer Studie etwas weniger aktiv als im Obergriff; der Bizeps unterschied sich kaum."},{"name":"Oberkörper etwa 30 Grad zurückgelehnt","effect":"Die hintere Schulter arbeitet etwas mehr; der Latissimus bleibt etwa gleich."},{"name":"Sehr breiter Griff","effect":"Bringt dem Latissimus keinen klaren Vorteil, du schaffst aber meist etwas weniger Gewicht."}],"sources":["https://www.acefitness.org/resources/everyone/exercise-library/158/seated-lat-pulldown/"],"studies":5,"img":1},{"id":"rudern","name":"Rudern sitzend (Kabel)","aliases":["Seated Cable Row","Kabelrudern"],"kind":"Kabel","muscle":"Rücken","primary":["Breiter Rückenmuskel (Latissimus)","Mittlerer Trapezmuskel","Rautenmuskeln"],"secondary":["Hintere Schulter","Bizeps","Oberarmmuskel (Brachialis)","Rückenstrecker"],"setup":"Stell die Füße auf die Fußstützen und setz dich so weit weg, dass die Arme gestreckt sind und die Knie leicht gebeugt bleiben.","steps":["Greif den Griff, setz dich aufrecht hin und heb die Brust.","Zieh den Griff zum Bauch und führ die Ellbogen nah am Körper nach hinten.","Drück die Schulterblätter am Ende kurz zusammen.","Streck die Arme langsam wieder, ohne den Rücken rund zu machen."],"cues":["Oberkörper bleibt ruhig.","Brust raus.","Ellbogen nach hinten, nicht nach oben."],"mistakes":["Mit dem Oberkörper weit vor und zurück schaukeln.","Rücken rund machen.","Schultern hochziehen."],"variants":[{"name":"Enger Griff (V-Griff)","effect":"Mehr Arbeit für den Latissimus."},{"name":"Breiter Griff, Ellbogen seitlich","effect":"Mehr Arbeit für den ganzen Trapezmuskel und die Schultern, weniger für den Latissimus."},{"name":"Ellbogen eng am Körper","effect":"Mit eng geführten Armen war der Latissimus in Studien eher aktiver."}],"sources":["https://www.acefitness.org/resources/everyone/exercise-library/48/seated-row/"],"studies":2,"img":1},{"id":"brustpresse","name":"Brustpresse","aliases":["Chest Press Maschine"],"kind":"Maschine","muscle":"Brust","primary":["Großer Brustmuskel"],"secondary":["Vordere Schulter","Trizeps"],"setup":"Stell die Sitzhöhe so ein, dass die Griffe etwa auf Höhe der mittleren Brust sind.","steps":["Setz dich mit dem Rücken an die Lehne und stell die Füße fest auf den Boden.","Zieh die Schulterblätter leicht nach hinten unten.","Drück die Griffe nach vorn, bis die Arme fast gestreckt sind.","Lass die Griffe langsam zurück, bis du eine leichte Dehnung in der Brust spürst."],"cues":["Schultern bleiben hinten an der Lehne.","Handgelenke gerade.","Langsam zurück."],"mistakes":["Schultern rollen nach vorn.","Rücken hebt von der Lehne ab.","Gewicht vorn mit Schwung stoßen."],"variants":[{"name":"Ellbogen eng am Körper","effect":"Der Trizeps arbeitet etwas mehr."},{"name":"Ellbogen weiter nach außen","effect":"Die Brust arbeitet etwas mehr."},{"name":"Sitz tiefer (Griffe höher)","effect":"Nach Studien zur Schrägbank vermutlich etwas mehr oberer Brustanteil; für die Maschine selbst gibt es kaum Daten."}],"sources":["https://www.acefitness.org/resources/everyone/exercise-library/19/chest-press/"],"studies":3,"img":1},{"id":"schulterpresse","name":"Schulterpresse (Maschine)","aliases":["Machine Shoulder Press"],"kind":"Maschine","muscle":"Schultern","primary":["Vordere Schulter","Seitliche Schulter"],"secondary":["Trizeps","Oberer Brustanteil","Oberer Trapezmuskel"],"setup":"Stell den Sitz so ein, dass die Griffe in der Startposition etwa auf Schulterhöhe sind.","steps":["Setz dich mit dem Rücken fest an die Lehne und greif die Griffe.","Spann den Bauch an und drück die Griffe nach oben, bis die Arme fast gestreckt sind.","Lass die Griffe langsam zurück, bis die Hände etwa auf Schulterhöhe sind."],"cues":["Rücken bleibt an der Lehne.","Schultern nicht hochziehen.","Oben nicht einrasten."],"mistakes":["Ins Hohlkreuz gehen.","Nur halbe Wiederholungen.","Ellbogen weit hinter den Körper führen."],"variants":[{"name":"Neutralgriff (Handflächen zueinander)","effect":"Bei Maschinen mit Neutralgriff arbeitet die Brust etwas mehr mit; viele empfinden ihn als schulterfreundlicher."},{"name":"Engerer Griff","effect":"Mehr Bewegung im Ellbogen und etwas mehr Arbeit für den Trizeps."}],"sources":[],"studies":3,"img":1},{"id":"seitheben","name":"Seitheben (Kurzhantel)","aliases":["Lateral Raise"],"kind":"Freihantel","muscle":"Schultern","primary":["Seitliche Schulter"],"secondary":["Vordere Schulter","Hintere Schulter","Oberer Trapezmuskel"],"setup":"Nimm leichte Kurzhanteln und stell dich etwas breiter als hüftbreit hin.","steps":["Lass die Hanteln neben den Oberschenkeln hängen, Ellbogen leicht gebeugt.","Spann den Bauch an und zieh die Schultern nach unten.","Heb die Arme seitlich bis etwa Schulterhöhe, die Ellbogen führen.","Senk die Hanteln langsam wieder ab."],"cues":["Ellbogen führen, Hände folgen.","Schultern weg von den Ohren.","Nicht über Schulterhöhe ziehen."],"mistakes":["Mit Schwung aus dem Rücken heben.","Schultern hochziehen.","Zu schweres Gewicht."],"variants":[{"name":"Daumen leicht nach oben (Arm etwas außen rotiert)","effect":"Vordere und seitliche Schulter arbeiten etwas mehr; schont laut ACE eher die Schulter."},{"name":"Daumen nach unten (Arm innen rotiert)","effect":"Mehr hintere Schulter und oberer Trapez; diese Stellung kann die Schulter einengen."},{"name":"Ellbogen stark gebeugt","effect":"Kürzerer Hebel, die seitliche Schulter war dabei weniger aktiv."}],"sources":["https://www.acefitness.org/resources/everyone/exercise-library/26/lateral-raise/"],"studies":1,"img":1},{"id":"bizeps","name":"Bizeps Curls (Kurzhantel)","aliases":["Dumbbell Curl","Bizepscurl"],"kind":"Freihantel","muscle":"Arme","primary":["Bizeps"],"secondary":["Oberarmmuskel (Brachialis)","Oberarmspeichenmuskel (Brachioradialis)","Unterarmbeuger"],"setup":"Nimm zwei Kurzhanteln und stell dich hüftbreit oder in leichter Schrittstellung hin.","steps":["Lass die Arme gestreckt hängen, Handflächen nach vorn.","Spann den Bauch an und zieh die Schultern leicht nach hinten.","Beug die Ellbogen und führ die Hanteln Richtung Schulter, die Oberarme bleiben am Körper.","Senk die Hanteln langsam, bis die Arme wieder gestreckt sind."],"cues":["Ellbogen bleiben an der Seite.","Kein Schwung aus dem Rücken.","Unten ganz strecken."],"mistakes":["Mit dem Oberkörper schwingen.","Ellbogen wandern nach vorn.","Handgelenke abknicken."],"variants":[{"name":"Handflächen nach oben (supiniert)","effect":"Der Bizeps ist hier am stärksten aktiv."},{"name":"Hammergriff (Daumen oben)","effect":"Der Bizeps arbeitet weniger; Oberarmmuskel und Oberarmspeichenmuskel tragen relativ mehr bei."},{"name":"Obergriff (Handflächen nach unten)","effect":"Der Bizeps arbeitet deutlich weniger, der Unterarm mehr."}],"sources":["https://www.acefitness.org/resources/everyone/exercise-library/10/hammer-curl/"],"studies":2,"img":1},{"id":"trizeps","name":"Trizepsdrücken am Kabel","aliases":["Triceps Pushdown","Pressdown"],"kind":"Kabel","muscle":"Arme","primary":["Trizeps"],"secondary":["Unterarmmuskeln","Rumpf (Stabilisierung)"],"setup":"Stell die Rolle ganz nach oben und häng ein Seil oder eine Stange ein.","steps":["Stell dich hüftbreit hin, Knie leicht gebeugt, und greif das Seil.","Zieh die Ellbogen an die Seiten.","Drück die Hände nach unten, bis die Arme ganz gestreckt sind.","Lass die Hände langsam wieder hoch, die Oberarme bleiben ruhig."],"cues":["Ellbogen kleben an der Seite.","Nur die Unterarme bewegen sich.","Unten ganz strecken."],"mistakes":["Ellbogen wandern nach vorn.","Mit dem Oberkörper mitdrücken.","Zu schnell nach oben lassen."],"variants":[{"name":"Überkopf statt nach unten","effect":"Der lange Trizepskopf ist gedehnt; in einer Studie wuchs der Trizeps überkopf deutlich mehr, vor allem der lange Kopf."},{"name":"Seil statt Stange","effect":"Unterschiede zwischen den Trizepsköpfen sind in Studien uneinheitlich; nimm, was sich besser anfühlt."}],"sources":["https://www.acefitness.org/resources/everyone/exercise-library/3/triceps-pressdown/"],"studies":1,"img":1},{"id":"kniebeuge","name":"Kniebeuge Langhantel","aliases":["Back Squat","Squat"],"kind":"Freihantel","muscle":"Beine","primary":["Oberschenkelvorderseite (Quadrizeps)","Großer Gesäßmuskel (Gluteus maximus)"],"secondary":["Adduktoren","Rückenstrecker","Beinbeuger","Waden","Rumpf"],"setup":"Stell die Ablage im Rack knapp unter Schulterhöhe und die Sicherungen knapp unter deine tiefste Position.","steps":["Leg die Stange auf den oberen Rücken und greif sie breiter als schulterbreit.","Heb die Stange aus, geh einen Schritt zurück und stell die Füße etwas breiter als schulterbreit.","Spann den Bauch an und setz dich mit geradem Rücken nach hinten unten.","Geh so tief, wie du mit geradem Rücken kommst, ideal bis die Hüfte unter Kniehöhe ist.","Drück dich über die ganze Fußsohle wieder nach oben."],"cues":["Brust raus, Rücken gerade.","Knie folgen den Zehen.","Druck über den ganzen Fuß."],"mistakes":["Rücken wird unten rund.","Knie fallen nach innen.","Fersen heben ab."],"variants":[{"name":"Tief (Hüfte unter Knie)","effect":"Mehr Wachstum für Po und Adduktoren als bei der halben Kniebeuge; die Oberschenkelvorderseite wuchs ähnlich."},{"name":"Breiter Stand, Zehen weiter außen","effect":"Verändert die Belastung von Hüfte und Knie; Adduktoren und Po werden etwas mehr gefordert."},{"name":"Stange tiefer auf dem Rücken (Low Bar)","effect":"Mehr Vorlage im Oberkörper, darum arbeiten die Hüftstrecker etwas mehr."}],"sources":["https://www.acefitness.org/resources/everyone/exercise-library/11/back-squat/"],"studies":5,"img":1},{"id":"gobletsquat","name":"Goblet Squat","aliases":["Goblet-Kniebeuge"],"kind":"Freihantel","muscle":"Beine","primary":["Oberschenkelvorderseite (Quadrizeps)","Großer Gesäßmuskel (Gluteus maximus)"],"secondary":["Adduktoren","Rumpf","Oberer Rücken (Halten)"],"setup":"Nimm eine Kurzhantel oder Kettlebell und halte sie senkrecht vor der Brust.","steps":["Stell die Füße etwa schulterbreit, Zehen leicht nach außen.","Halte die Hantel nah an der Brust, Ellbogen zeigen nach unten.","Setz dich mit geradem Rücken nach unten, bis die Hüfte unter Kniehöhe ist.","Drück dich über beide Füße wieder hoch."],"cues":["Ellbogen nah an den Rippen.","Oberkörper bleibt aufrecht.","Knie nach außen schieben."],"mistakes":["Rücken wird rund.","Fersen heben ab.","Knie fallen nach innen."],"variants":[{"name":"Tiefer gehen","effect":"Mehr Arbeit für Po und Adduktoren, ähnlich wie bei der tiefen Langhantel-Kniebeuge."},{"name":"Breiterer Stand","effect":"Die Adduktoren und die Hüfte werden etwas mehr gefordert."}],"sources":["https://www.acefitness.org/resources/everyone/exercise-library/362/goblet-squat/"],"studies":2,"img":1},{"id":"smithsquat","name":"Kniebeuge an der Multipresse (Smith)","aliases":["Smith Machine Squat","Multipresse Kniebeuge"],"kind":"Maschine","muscle":"Beine","primary":["Oberschenkelvorderseite (Quadrizeps)","Großer Gesäßmuskel (Gluteus maximus)"],"secondary":["Adduktoren","Beinbeuger","Waden"],"setup":"Stell die Stange knapp unter Schulterhöhe und die Sicherungsstopper knapp unter deine tiefste Position.","steps":["Stell dich unter die Stange und leg sie auf den oberen Rücken.","Stell die Füße schulterbreit hin und dreh die Stange aus den Haken.","Beug Knie und Hüfte und geh mit geradem Rücken nach unten.","Drück dich über die ganze Fußsohle wieder hoch und häng die Stange am Ende ein."],"cues":["Fußposition vor dem ersten Satz festlegen.","Rücken gerade, Bauch fest.","Knie zeigen zu den Zehen."],"mistakes":["Füße zu weit vorn und dann ins Hohlkreuz fallen.","Knie fallen nach innen.","Zu tief mit rundem Rücken."],"variants":[{"name":"Füße weiter vor der Stange","effect":"Mehr Last auf Hüfte und Po, weniger auf das Knie (laut biomechanischem Modell)."},{"name":"Füße direkt unter der Stange","effect":"Mehr Last auf das Knie und damit mehr Fokus auf die Oberschenkelvorderseite."},{"name":"Freie Kniebeuge statt Multipresse","effect":"Frei waren Waden, Beinbeuger und innerer Oberschenkelmuskel in einer Studie aktiver."}],"sources":[],"studies":3,"img":1},{"id":"hackenschmidt","name":"Hackenschmidt-Kniebeuge","aliases":["Hack Squat"],"kind":"Maschine","muscle":"Beine","primary":["Oberschenkelvorderseite (Quadrizeps)"],"secondary":["Großer Gesäßmuskel","Adduktoren","Waden"],"setup":"Stell dich mit Rücken und Schultern fest an die Polster und stell die Füße schulterbreit mittig auf die Plattform.","steps":["Löse die Sicherung und spann den Bauch an.","Beug die Knie und geh langsam nach unten, Rücken bleibt am Polster.","Geh so tief, wie du mit Po am Polster kommst.","Drück dich über die ganze Fußsohle wieder hoch, ohne die Knie einzurasten."],"cues":["Rücken bleibt am Polster.","Knie folgen den Zehen.","Unten nicht abfedern."],"mistakes":["Fersen heben ab.","Knie fallen nach innen.","Oben Knie durchstrecken."],"variants":[{"name":"Füße hoch auf der Plattform","effect":"Mehr Hüftarbeit, darum vermutlich etwas mehr Po; direkte Studien zur Hackenschmidt-Maschine fehlen."},{"name":"Füße tief auf der Plattform","effect":"Stärkere Kniebeugung, mehr Fokus auf die Oberschenkelvorderseite."},{"name":"Tiefer gehen","effect":"Mehr Bewegungsweite brachte in Studien mehr Wachstum an den Beinen."}],"sources":[],"studies":3,"img":1},{"id":"splitsquat","name":"Bulgarian Split Squat","aliases":["Bulgarische Kniebeuge","Rear Foot Elevated Split Squat"],"kind":"Freihantel","muscle":"Beine","primary":["Oberschenkelvorderseite (Quadrizeps)","Großer Gesäßmuskel (Gluteus maximus)"],"secondary":["Mittlerer Gesäßmuskel","Adduktoren","Beinbeuger","Rumpf"],"setup":"Nimm eine Bank etwa in Kniehöhe oder etwas tiefer und leg den hinteren Fuß mit dem Spann darauf.","steps":["Stell den vorderen Fuß so weit vor, dass das vordere Knie unten etwa über dem Fuß bleibt.","Spann den Bauch an, Hanteln hängen neben dem Körper.","Senk dich ab, bis der vordere Oberschenkel etwa waagerecht ist.","Drück dich über das vordere Bein wieder hoch.","Mach alle Wiederholungen auf einer Seite, dann wechsel."],"cues":["Gewicht auf dem vorderen Fuß.","Knie zeigt zu den Zehen.","Langsam runter."],"mistakes":["Vorderes Knie fällt nach innen.","Zu schweres Gewicht, das Gleichgewicht geht verloren.","Nicht tief genug gehen."],"variants":[{"name":"Oberkörper nach vorn geneigt","effect":"Mehr Arbeit für Po und Beinbeuger; das zeigte eine Studie mit trainierten Frauen."},{"name":"Oberkörper aufrecht","effect":"Mehr Fokus auf die Oberschenkelvorderseite."},{"name":"Längerer Schritt","effect":"Mehr Belastung für die Hüftstrecker, also eher Po."}],"sources":["https://www.nasm.org/resource-center/exercise-library/bulgarian-split-squat"],"studies":3,"img":2},{"id":"ausfallschritt","name":"Ausfallschritte","aliases":["Lunges","Forward Lunge"],"kind":"Freihantel","muscle":"Beine","primary":["Oberschenkelvorderseite (Quadrizeps)","Großer Gesäßmuskel (Gluteus maximus)"],"secondary":["Mittlerer Gesäßmuskel","Adduktoren","Beinbeuger","Waden","Rumpf"],"setup":"Stell dich aufrecht hin, mit oder ohne Kurzhanteln neben dem Körper.","steps":["Spann den Bauch an und zieh die Schultern nach hinten unten.","Mach einen großen Schritt nach vorn und setz den Fuß fest auf.","Senk die Hüfte nach unten, bis der vordere Oberschenkel etwa waagerecht ist.","Drück dich kräftig über das vordere Bein zurück in den Stand."],"cues":["Hüfte nach unten, nicht nach vorn.","Oberkörper ruhig, nicht zur Seite kippen.","Vorderes Knie zeigt zu den Zehen."],"mistakes":["Hüfte nach vorn schieben statt absenken.","Hohlkreuz.","Oberkörper wackelt zur Seite."],"variants":[{"name":"Langer Schritt","effect":"Po, mittlerer Gesäßmuskel und Beinbeuger arbeiten mehr als beim kurzen Schritt."},{"name":"Kurzer Schritt","effect":"Mehr Kniebeugung im Verhältnis, eher Oberschenkelvorderseite."},{"name":"Mit Schritt nach vorn und zurück (statt am Platz)","effect":"Großer und mittlerer Gesäßmuskel waren etwas aktiver als bei Ausfallschritten am Platz."}],"sources":["https://www.acefitness.org/resources/everyone/exercise-library/94/forward-lunge/"],"studies":1,"img":1},{"id":"beinbeugerliegend","name":"Beinbeuger liegend","aliases":["Lying Leg Curl"],"kind":"Maschine","muscle":"Beine","primary":["Beinbeuger (Hamstrings)"],"secondary":["Wadenmuskel (Gastrocnemius)"],"setup":"Stell das Polster so ein, dass es knapp über den Fersen liegt und die Knie knapp hinter der Bankkante sind.","steps":["Leg dich auf den Bauch und halte dich an den Griffen fest.","Drück die Hüfte auf die Bank und spann den Bauch an.","Zieh die Fersen kontrolliert zum Po.","Lass die Beine langsam zurück, bis sie fast gestreckt sind."],"cues":["Hüfte bleibt auf der Bank.","Langsam ablassen.","Ganze Bewegung nutzen."],"mistakes":["Hüfte hebt ab und du gehst ins Hohlkreuz.","Mit Schwung ziehen.","Halbe Wiederholungen."],"variants":[{"name":"Sitzend statt liegend","effect":"In einer Studie wuchsen die Beinbeuger sitzend deutlich mehr, weil sie dort gedehnter arbeiten."},{"name":"Fußspitzen angezogen oder gestreckt","effect":"Machte in einer Studie keinen Unterschied für Aktivität und Wachstum; wähle, was sich gut anfühlt."}],"sources":["https://www.nasm.org/resource-center/exercise-library/lying-leg-curl"],"studies":3,"img":1},{"id":"adduktor","name":"Adduktoren-Maschine","aliases":["Hip Adduction","Adduktoren"],"kind":"Maschine","muscle":"Beine","primary":["Adduktoren (Oberschenkelinnenseite)"],"secondary":["Kammmuskel (Pectineus)","Schlanker Muskel (Gracilis)"],"setup":"Stell die Startweite so ein, dass du innen eine leichte Dehnung spürst, ohne dass es zieht.","steps":["Setz dich aufrecht hin und leg die Innenseite der Knie an die Polster.","Halte dich an den Griffen fest und spann den Bauch an.","Drück die Beine kontrolliert zusammen.","Lass die Beine langsam auseinander bis zur Startposition."],"cues":["Langsam öffnen.","Po bleibt im Sitz.","Nicht weiter öffnen, als es angenehm ist."],"mistakes":["Startweite zu groß und dann ruckartig ziehen.","Mit Schwung arbeiten.","Gewicht vorn zusammenschlagen lassen."],"variants":[{"name":"Größere Startweite (mehr Dehnung)","effect":"Mehr Bewegungsweite brachte in Studien allgemein mehr Wachstum; zur Adduktoren-Maschine selbst gibt es kaum Daten."}],"sources":[],"studies":2,"img":1},{"id":"wadenheben","name":"Wadenheben","aliases":["Calf Raise"],"kind":"Maschine","muscle":"Beine","primary":["Wadenmuskel (Gastrocnemius)","Schollenmuskel (Soleus)"],"secondary":["Fußmuskeln"],"setup":"Stell die Fußballen auf die Kante der Plattform, sodass die Fersen frei hängen.","steps":["Stell dich gerade hin oder setz dich in die Maschine, Fußballen hüftbreit auf der Kante.","Senk die Fersen langsam ab, bis die Wade gut gedehnt ist.","Drück dich über die Fußballen so hoch wie möglich.","Halte oben kurz und senk dich wieder langsam ab."],"cues":["Unten kurz dehnen, nicht abfedern.","Ganz nach oben drücken.","Knie bleiben ruhig."],"mistakes":["Wippen statt ganzer Bewegung.","Zu schweres Gewicht und nur halbe Wiederholungen.","Knie beugen und mitschieben."],"variants":[{"name":"Knie gestreckt (stehend oder an der Beinpresse)","effect":"Der Wadenmuskel (Gastrocnemius) wächst deutlich besser als im Sitzen."},{"name":"Knie gebeugt (sitzend)","effect":"Mehr Fokus auf den Schollenmuskel; der Gastrocnemius wuchs in einer Studie kaum."},{"name":"Fußspitzen außen oder innen","effect":"Spitzen außen betonten in einer Studie den inneren Wadenkopf, Spitzen innen den äußeren."},{"name":"Fokus auf die untere Hälfte","effect":"Wiederholungen im gedehnten Bereich brachten in einer Studie mit Frauen mehr Wachstum."}],"sources":["https://www.nasm.org/resource-center/exercise-library/leg-press-calf-raise"],"studies":4,"img":1},{"id":"kickback","name":"Glute Kickback am Kabel","aliases":["Cable Kickback"],"kind":"Kabel","muscle":"Po","primary":["Großer Gesäßmuskel (Gluteus maximus)"],"secondary":["Beinbeuger (Hamstrings)","Mittlerer Gesäßmuskel","Rumpf"],"setup":"Stell die Rolle ganz nach unten und befestige die Fußschlaufe am Fußgelenk.","steps":["Stell dich vor das Kabel, halte dich fest und neig den Oberkörper leicht nach vorn.","Spann den Bauch an und halte das Becken gerade.","Streck das Bein aus der Hüfte nach hinten, bis der Po fest angespannt ist.","Führ das Bein langsam wieder nach vorn."],"cues":["Bewegung aus der Hüfte, nicht aus dem Rücken.","Becken bleibt gerade.","Oben kurz halten."],"mistakes":["Ins Hohlkreuz gehen, um das Bein höher zu bringen.","Becken zur Seite aufdrehen.","Mit Schwung kicken."],"variants":[{"name":"Bein gestreckt","effect":"Die Beinbeuger arbeiten deutlich mit; Kickbacks zeigten hohe Aktivität im hinteren Oberschenkel."},{"name":"Knie gebeugt","effect":"Die Beinbeuger werden etwas zurückgenommen, der Po bekommt relativ mehr Arbeit; die Daten stammen aus Übungen am Boden."}],"sources":["https://www.nsca.com/contentassets/f921c5b3fe4142db964a943d3554b324/ptq-10.4.4-program-design-considerations-for-optimal-strength-hypertophy-glute-mucsles.pdf"],"studies":3,"img":1},{"id":"kreuzheben","name":"Kreuzheben (konventionell)","aliases":["Deadlift","Conventional Deadlift"],"kind":"Freihantel","muscle":"Ganzkörper","primary":["Großer Gesäßmuskel (Gluteus maximus)","Beinbeuger (Hamstrings)","Oberschenkelvorderseite (Quadrizeps)","Rückenstrecker"],"secondary":["Trapezmuskel","Breiter Rückenmuskel","Adduktoren","Unterarme (Griff)","Rumpf"],"setup":"Stell dich hüftbreit hin, die Stange über der Fußmitte und nah an den Schienbeinen.","steps":["Greif die Stange knapp außerhalb der Beine.","Schieb die Hüfte etwas zurück, Brust raus, Rücken gerade, Schultern über der Stange.","Spann den Bauch an und nimm die Spannung aus der Stange.","Drück dich über die ganze Fußsohle hoch und schieb die Hüfte nach vorn, bis du aufrecht stehst.","Senk die Stange kontrolliert nah am Körper wieder ab."],"cues":["Stange bleibt am Körper.","Rücken gerade.","Boden wegdrücken."],"mistakes":["Rücken wird rund.","Stange wandert nach vorn weg.","Ruckartig vom Boden reißen."],"variants":[{"name":"Sumo (breiter Stand, Griff innen)","effect":"Mehr Arbeit für die Oberschenkelvorderseite; der Rücken steht aufrechter."},{"name":"Konventionell","effect":"Mehr Arbeit für Beinbeuger und Wade als beim Sumo."},{"name":"Rumänisch (Beine fast gestreckt, nicht vom Boden)","effect":"Mehr Fokus auf Beinbeuger und Po, der Rückenstrecker arbeitet relativ weniger."}],"sources":["https://www.nasm.org/resource-center/exercise-library/barbell-deadlift","https://www.acefitness.org/resources/everyone/exercise-library/6/deadlift/"],"studies":3,"img":1},{"id":"hyperextension","name":"Hyperextension / Rückenstrecker","aliases":["Back Extension","Roman Chair"],"kind":"Körpergewicht","muscle":"Rücken","primary":["Rückenstrecker (Erector spinae)","Großer Gesäßmuskel (Gluteus maximus)","Beinbeuger (Hamstrings)"],"secondary":["Rumpf"],"setup":"Stell das Polster so ein, dass die Hüftknochen knapp über der Polsterkante liegen und du dich frei aus der Hüfte beugen kannst.","steps":["Hak die Fersen unter die Fußpolster und verschränk die Arme vor der Brust.","Beug dich mit geradem Rücken aus der Hüfte nach unten.","Komm wieder hoch, bis der Körper eine gerade Linie bildet.","Halte kurz und senk dich langsam wieder ab."],"cues":["Oben nur bis zur geraden Linie.","Langsam runter.","Po anspannen beim Hochkommen."],"mistakes":["Oben weit ins Hohlkreuz überstrecken.","Mit Schwung hochschnellen.","Polster zu hoch, sodass du dich nicht aus der Hüfte beugen kannst."],"variants":[{"name":"Rücken gerade, Bewegung aus der Hüfte","effect":"Mehr Arbeit für Po und Beinbeuger; die 45-Grad-Bank aktivierte Po und Beinbeuger in einer Studie mit Frauen stark."},{"name":"Rücken rollt sich ein und wieder auf","effect":"Mehr Fokus auf den Rückenstrecker; das ergibt sich aus der Bewegung, direkte Vergleichsstudien fehlen."},{"name":"Mit Zusatzgewicht vor der Brust","effect":"Höhere Last für alle beteiligten Muskeln."}],"sources":[],"studies":2,"img":1},{"id":"klimmzugassistiert","name":"Klimmzug assistiert (Maschine)","aliases":["Assisted Pull-Up","Gravitron"],"kind":"Maschine","muscle":"Rücken","primary":["Breiter Rückenmuskel (Latissimus)","Rautenmuskeln"],"secondary":["Bizeps","Mittlerer und unterer Trapezmuskel","Hintere Schulter","Rumpf"],"setup":"Wähl die Unterstützung so, dass du 6 bis 12 saubere Wiederholungen schaffst; mehr Gewicht heißt mehr Hilfe.","steps":["Knie dich auf das Polster und greif die Griffe etwas breiter als schulterbreit.","Lass dich hängen, bis die Arme gestreckt sind, und zieh die Schulterblätter nach unten.","Zieh dich hoch, bis das Kinn über den Griffen ist, Ellbogen nach unten.","Senk dich langsam ab, bis die Arme wieder gestreckt sind."],"cues":["Brust zur Stange.","Ellbogen nach unten ziehen.","Unten ganz strecken."],"mistakes":["Nur halbe Wiederholungen.","Schultern ziehen hoch.","Zu schnell fallen lassen."],"variants":[{"name":"Untergriff (Chin-up)","effect":"Bizeps und Brust arbeiten mehr mit."},{"name":"Obergriff","effect":"Der untere Trapezmuskel ist etwas aktiver als im Untergriff."},{"name":"Neutralgriff","effect":"Der Latissimus arbeitet ähnlich wie bei anderen Griffen; der mittlere Trapez war im Obergriff aktiver."}],"sources":["https://www.nasm.org/resource-center/exercise-library/pull-up"],"studies":3,"img":2},{"id":"ruderbrust","name":"Rudermaschine mit Brustpolster","aliases":["Chest Supported Row","Rudern Maschine"],"kind":"Maschine","muscle":"Rücken","primary":["Breiter Rückenmuskel (Latissimus)","Mittlerer Trapezmuskel","Rautenmuskeln"],"secondary":["Hintere Schulter","Bizeps","Oberarmmuskel (Brachialis)"],"setup":"Stell den Sitz so ein, dass das Brustpolster auf Höhe der Brust liegt und du die Griffe mit gestreckten Armen gerade erreichst.","steps":["Setz dich hin und leg die Brust fest ans Polster.","Greif die Griffe und zieh die Schultern nach hinten unten.","Zieh die Griffe zum Körper und führ die Ellbogen nach hinten.","Lass die Arme langsam wieder nach vorn, bis sie gestreckt sind."],"cues":["Brust bleibt am Polster.","Schulterblätter zusammen.","Langsam zurück."],"mistakes":["Brust vom Polster abheben und mit Schwung ziehen.","Schultern hochziehen.","Nur halbe Wiederholungen."],"variants":[{"name":"Neutralgriff, Ellbogen nah am Körper","effect":"Mehr Arbeit für den Latissimus."},{"name":"Breiter Griff, Ellbogen seitlich","effect":"Mehr Arbeit für Trapezmuskel und hintere Schulter."}],"sources":[],"studies":2,"img":1},{"id":"kurzhantelrudern","name":"Kurzhantel-Rudern einarmig","aliases":["One-Arm Dumbbell Row"],"kind":"Freihantel","muscle":"Rücken","primary":["Breiter Rückenmuskel (Latissimus)","Mittlerer Trapezmuskel","Rautenmuskeln"],"secondary":["Hintere Schulter","Bizeps","Rumpf"],"setup":"Stütz eine Hand und ein Knie auf einer Bank ab, der Rücken ist gerade und etwa waagerecht.","steps":["Nimm die Hantel in die freie Hand und lass den Arm gestreckt hängen.","Spann den Bauch an und halte den Rücken gerade.","Zieh die Hantel Richtung Hüfte, der Ellbogen geht nah am Körper nach hinten.","Senk die Hantel langsam ab, bis der Arm gestreckt ist."],"cues":["Rücken gerade, nicht verdrehen.","Ellbogen nach hinten, nicht nach oben.","Unten ganz strecken."],"mistakes":["Oberkörper aufdrehen, um das Gewicht hochzubekommen.","Schulter hochziehen.","Mit Schwung reißen."],"variants":[{"name":"Ellbogen nah am Körper, Zug zur Hüfte","effect":"Mehr Arbeit für den Latissimus."},{"name":"Ellbogen seitlich abgespreizt, Zug zur Brust","effect":"Mehr Arbeit für Trapezmuskel und hintere Schulter."}],"sources":["https://www.acefitness.org/resources/everyone/exercise-library/12/bent-over-row/"],"studies":2,"img":1},{"id":"bankdruecken","name":"Bankdrücken Langhantel","aliases":["Bench Press"],"kind":"Freihantel","muscle":"Brust","primary":["Großer Brustmuskel"],"secondary":["Trizeps","Vordere Schulter"],"setup":"Leg dich so auf die Bank, dass die Augen unter der Stange sind, und stell die Sicherungen passend ein.","steps":["Stell die Füße fest auf den Boden und zieh die Schulterblätter nach hinten unten.","Greif die Stange etwas breiter als schulterbreit und heb sie aus.","Senk die Stange kontrolliert zur unteren Brust, Ellbogen leicht schräg zum Körper.","Drück die Stange wieder nach oben, bis die Arme gestreckt sind."],"cues":["Schulterblätter bleiben hinten.","Füße fest am Boden.","Stange berührt leicht die Brust, nicht abfedern."],"mistakes":["Stange auf der Brust abfedern.","Po hebt von der Bank ab.","Ellbogen stehen ganz seitlich im 90-Grad-Winkel."],"variants":[{"name":"Enger Griff","effect":"Mehr Arbeit für Trizeps, vordere Schulter und oberen Brustanteil."},{"name":"Breiter Griff","effect":"Mehr Arbeit für den unteren Brustanteil und mehr Last auf die Schulter."},{"name":"Bank 30 Grad schräg","effect":"Der obere Brustanteil ist am stärksten aktiv."}],"sources":[],"studies":3,"img":1},{"id":"schraegbankkh","name":"Schrägbankdrücken Kurzhantel","aliases":["Incline Dumbbell Press"],"kind":"Freihantel","muscle":"Brust","primary":["Großer Brustmuskel (oberer Anteil)","Vordere Schulter"],"secondary":["Trizeps"],"setup":"Stell die Bank auf etwa 30 Grad und stell die Füße fest auf den Boden.","steps":["Leg dich mit den Hanteln auf die Bank und zieh die Schulterblätter nach hinten unten.","Drück die Hanteln über die Augen, bis die Arme gestreckt sind.","Senk die Hanteln langsam zur oberen Brust, leicht nach außen.","Drück sie wieder nach oben."],"cues":["Handgelenke gerade.","Ellbogen unter den Handgelenken.","Langsam runter."],"mistakes":["Hohlkreuz und Po hebt ab.","Hanteln auf der Brust abfedern.","Bank zu steil, dann wird es eine Schulterübung."],"variants":[{"name":"Bank etwa 30 Grad","effect":"In einer Studie war der obere Brustanteil hier am aktivsten."},{"name":"Bank 45 Grad oder steiler","effect":"Die vordere Schulter arbeitet deutlich mehr, die Brust weniger; die Studien sind sich beim besten Winkel nicht ganz einig."},{"name":"Ellbogen enger am Körper","effect":"Mehr Arbeit für den Trizeps."}],"sources":["https://www.acefitness.org/resources/everyone/exercise-library/25/incline-chest-press/"],"studies":2,"img":1},{"id":"butterfly","name":"Butterfly (Pec Deck)","aliases":["Pec Deck","Fly-Maschine"],"kind":"Maschine","muscle":"Brust","primary":["Großer Brustmuskel"],"secondary":["Vordere Schulter"],"setup":"Stell den Sitz so ein, dass die Griffe oder Polster etwa auf Brusthöhe sind.","steps":["Setz dich mit dem Rücken an die Lehne und greif die Griffe, Ellbogen leicht gebeugt.","Zieh die Schulterblätter leicht nach hinten unten.","Führ die Arme in einem Bogen vor der Brust zusammen.","Öffne die Arme langsam, bis du eine leichte Dehnung in der Brust spürst."],"cues":["Arme bleiben leicht gebeugt.","Schultern hinten lassen.","Langsam öffnen."],"mistakes":["Schultern rollen nach vorn.","Zu weit öffnen, sodass es in der Schulter zieht.","Mit Schwung zusammenschlagen."],"variants":[{"name":"Im Vergleich zum Bankdrücken","effect":"Brust und vordere Schulter arbeiten ähnlich stark, der Trizeps deutlich weniger."},{"name":"Volle Dehnung statt kurzer Bewegung","effect":"Mehr Bewegungsweite fördert eher das Wachstum; für diese Maschine gibt es dazu wenige Daten."}],"sources":[],"studies":3,"img":1},{"id":"reversebutterfly","name":"Reverse Butterfly","aliases":["Reverse Pec Deck","Rear Delt Fly"],"kind":"Maschine","muscle":"Schultern","primary":["Hintere Schulter"],"secondary":["Mittlerer Trapezmuskel","Rautenmuskeln","Untergrätenmuskel (Infraspinatus)"],"setup":"Setz dich mit der Brust zum Polster und stell den Sitz so ein, dass die Griffe auf Schulterhöhe sind.","steps":["Greif die Griffe mit fast gestreckten Armen.","Zieh die Arme in einem Bogen nach hinten, bis sie etwa in Linie mit dem Körper sind.","Halte kurz.","Führ die Arme langsam wieder nach vorn."],"cues":["Brust bleibt am Polster.","Schultern nicht hochziehen.","Arme weit, Ellbogen leicht gebeugt."],"mistakes":["Schultern ziehen hoch.","Mit Schwung arbeiten.","Arme zu stark beugen und rudern."],"variants":[{"name":"Neutralgriff (Daumen oben)","effect":"Hintere Schulter und Untergrätenmuskel waren in einer Studie aktiver als im Obergriff."},{"name":"Obergriff (Handflächen nach unten)","effect":"Die hintere Schulter arbeitet etwas weniger als im Neutralgriff."}],"sources":[],"studies":1,"img":1},{"id":"facepull","name":"Face Pulls","aliases":["Face Pull"],"kind":"Kabel","muscle":"Schultern","primary":["Hintere Schulter","Rautenmuskeln"],"secondary":["Mittlerer Trapezmuskel","Untergrätenmuskel (Infraspinatus)","Bizeps"],"setup":"Stell die Rolle etwa auf Augenhöhe und häng ein Seil ein.","steps":["Greif das Seil mit beiden Händen und geh einen Schritt zurück, bis Spannung da ist.","Spann den Bauch an und zieh die Schultern nach hinten unten.","Zieh das Seil Richtung Gesicht, die Ellbogen gehen nach hinten außen.","Streck die Arme langsam wieder."],"cues":["Ellbogen hoch und nach hinten.","Schultern weg von den Ohren.","Leichtes Gewicht, saubere Bewegung."],"mistakes":["Zu viel Gewicht und Ziehen mit Schwung.","Schultern hochziehen.","Nur mit den Armen ziehen."],"variants":[{"name":"Seilenden am Ende weit auseinanderziehen (Hände neben dem Kopf)","effect":"Mehr Außenrotation, darum vermutlich etwas mehr Arbeit für die Außenrotatoren und die hintere Schulter; Studien dazu fehlen."}],"sources":["https://www.nasm.org/resource-center/exercise-library/face-pull"],"studies":0,"img":1},{"id":"seithebenkabel","name":"Seitheben am Kabel","aliases":["Cable Lateral Raise"],"kind":"Kabel","muscle":"Schultern","primary":["Seitliche Schulter"],"secondary":["Vordere Schulter","Hintere Schulter","Oberer Trapezmuskel"],"setup":"Stell die Rolle ganz nach unten und stell dich seitlich daneben, der Griff ist in der Hand, die vom Kabel weiter weg ist.","steps":["Lass den Arm locker vor dem Körper hängen, Ellbogen leicht gebeugt.","Halte dich mit der freien Hand fest und spann den Bauch an.","Heb den Arm seitlich bis etwa Schulterhöhe.","Senk ihn langsam wieder ab."],"cues":["Ellbogen führt.","Schulter bleibt unten.","Langsam runter, das Kabel zieht weiter."],"mistakes":["Oberkörper kippt weg.","Schulter zieht hoch.","Zu schweres Gewicht."],"variants":[{"name":"Kabel statt Kurzhantel","effect":"Brachte in einer Studie gleich viel Wachstum der seitlichen Schulter; nimm, was dir besser liegt."},{"name":"Daumen leicht nach oben","effect":"Vordere und seitliche Schulter arbeiten etwas mehr, eher schulterfreundlich."}],"sources":["https://www.acefitness.org/resources/everyone/exercise-library/26/lateral-raise/"],"studies":2,"img":2},{"id":"schulterdrueckenkh","name":"Schulterdrücken Kurzhantel","aliases":["Dumbbell Shoulder Press"],"kind":"Freihantel","muscle":"Schultern","primary":["Vordere Schulter","Seitliche Schulter"],"secondary":["Trizeps","Oberer Trapezmuskel","Rumpf"],"setup":"Stell die Lehne einer Bank senkrecht oder fast senkrecht und setz dich mit dem Rücken daran.","steps":["Halte die Hanteln auf Schulterhöhe, Handflächen nach vorn.","Spann den Bauch an und drück den Rücken an die Lehne.","Drück die Hanteln nach oben, bis die Arme fast gestreckt sind.","Senk sie langsam wieder auf Schulterhöhe."],"cues":["Rippen unten, kein Hohlkreuz.","Unterarme senkrecht.","Oben nicht einrasten."],"mistakes":["Ins Hohlkreuz gehen.","Hanteln zu weit nach vorn oder hinten.","Nur halbe Wiederholungen."],"variants":[{"name":"Im Stehen","effect":"Alle drei Teile der Schulter waren aktiver als im Sitzen, du schaffst aber weniger Gewicht."},{"name":"Kurzhantel statt Langhantel","effect":"Die vordere Schulter war mit Kurzhanteln aktiver."}],"sources":[],"studies":1,"img":1},{"id":"hammercurls","name":"Hammer Curls","aliases":["Hammer Curl"],"kind":"Freihantel","muscle":"Arme","primary":["Oberarmmuskel (Brachialis)","Oberarmspeichenmuskel (Brachioradialis)"],"secondary":["Bizeps","Unterarmmuskeln"],"setup":"Nimm zwei Kurzhanteln und stell dich in leichte Schrittstellung.","steps":["Halte die Hanteln neben den Oberschenkeln, Daumen zeigen nach vorn.","Spann den Bauch an und zieh die Schultern nach hinten unten.","Beug die Ellbogen und führ die Hanteln Richtung Schulter.","Senk sie langsam, bis die Arme gestreckt sind."],"cues":["Daumen bleiben oben.","Ellbogen an der Seite.","Handgelenke gerade."],"mistakes":["Mit dem Rücken schwingen.","Ellbogen nach vorn schieben.","Schultern hochziehen."],"variants":[{"name":"Statt normalem Curl","effect":"Der Bizeps arbeitet weniger als mit nach oben gedrehten Handflächen; Oberarmmuskel und Oberarmspeichenmuskel tragen relativ mehr bei."},{"name":"Vor dem Körper quer (Cross-Body)","effect":"Wird oft für den Oberarmspeichenmuskel empfohlen; Studien dazu fehlen."}],"sources":["https://www.acefitness.org/resources/everyone/exercise-library/10/hammer-curl/"],"studies":2,"img":1},{"id":"trizepsueberkopf","name":"Trizeps Überkopf am Kabel","aliases":["Overhead Cable Triceps Extension"],"kind":"Kabel","muscle":"Arme","primary":["Trizeps (vor allem langer Kopf)"],"secondary":["Rumpf (Stabilisierung)"],"setup":"Stell die Rolle tief oder auf Brusthöhe, häng ein Seil ein und dreh dem Kabel den Rücken zu.","steps":["Greif das Seil und bring die Hände hinter den Kopf, Ellbogen zeigen nach vorn oben.","Stell dich in Schrittstellung und spann den Bauch an.","Streck die Arme nach vorn oben, bis sie fast gerade sind.","Beug die Ellbogen langsam, bis die Hände wieder hinter dem Kopf sind."],"cues":["Oberarme bleiben ruhig.","Ellbogen zeigen nach vorn.","Unten gut dehnen."],"mistakes":["Ellbogen gehen weit auseinander.","Ins Hohlkreuz gehen.","Mit dem ganzen Körper drücken."],"variants":[{"name":"Überkopf statt Trizepsdrücken nach unten","effect":"In einer Studie wuchs der ganze Trizeps mehr, vor allem der lange Kopf, obwohl weniger Gewicht bewegt wurde."},{"name":"Einarmig","effect":"Gleicher Muskelfokus, aber du kannst Seitenunterschiede besser ausgleichen."}],"sources":["https://www.acefitness.org/resources/everyone/exercise-library/74/triceps-extension/"],"studies":1,"img":1},{"id":"bauchmaschine","name":"Bauchmaschine (Crunch)","aliases":["Ab Crunch Machine"],"kind":"Maschine","muscle":"Bauch","primary":["Gerader Bauchmuskel (Rectus abdominis)"],"secondary":["Schräge Bauchmuskeln","Hüftbeuger"],"setup":"Stell den Sitz so ein, dass die Polster oder Griffe auf Höhe der oberen Brust oder Schultern liegen.","steps":["Setz dich hin, hak die Füße ein und greif die Griffe.","Atme aus und roll den Oberkörper nach vorn unten ein.","Halte kurz und spann den Bauch fest an.","Roll dich langsam wieder auf."],"cues":["Rippen Richtung Becken ziehen.","Ausatmen beim Einrollen.","Langsam zurück."],"mistakes":["Mit den Armen ziehen statt mit dem Bauch.","Aus der Hüfte beugen statt den Rücken einzurollen.","Zu schweres Gewicht und Schwung."],"variants":[{"name":"Mehr Einrollen der Wirbelsäule statt Beugen aus der Hüfte","effect":"Mehr Arbeit für den geraden Bauchmuskel, weniger für die Hüftbeuger."},{"name":"Leicht seitlich eindrehen","effect":"Die schrägen Bauchmuskeln arbeiten mehr; der obere und untere Teil des geraden Bauchmuskels lassen sich kaum getrennt trainieren."}],"sources":[],"studies":2,"img":1},{"id":"kabelcrunch","name":"Kabel-Crunch","aliases":["Cable Crunch","Kniender Kabel-Crunch"],"kind":"Kabel","muscle":"Bauch","primary":["Gerader Bauchmuskel (Rectus abdominis)"],"secondary":["Schräge Bauchmuskeln"],"setup":"Stell die Rolle ganz nach oben, häng ein Seil ein und knie dich davor.","steps":["Halte die Seilenden neben dem Kopf.","Spann den Bauch an, die Hüfte bleibt etwa über den Knien.","Roll den Oberkörper ein und zieh die Ellbogen Richtung Oberschenkel.","Roll dich langsam wieder auf."],"cues":["Hüfte bleibt ruhig.","Rücken einrollen, nicht nur nicken.","Ausatmen beim Einrollen."],"mistakes":["Mit den Armen ziehen.","Po nach hinten auf die Fersen setzen.","Nur mit dem Kopf nicken."],"variants":[{"name":"Mit Drehung zu einer Seite","effect":"Mehr Arbeit für die schrägen Bauchmuskeln."},{"name":"Oberer oder unterer Bauch","effect":"Lässt sich kaum gezielt verschieben; der gerade Bauchmuskel arbeitet als Ganzes."}],"sources":[],"studies":2,"img":1},{"id":"plank","name":"Plank","aliases":["Unterarmstütz","Front Plank"],"kind":"Körpergewicht","muscle":"Bauch","primary":["Gerader Bauchmuskel","Querer Bauchmuskel","Schräge Bauchmuskeln"],"secondary":["Rückenstrecker","Großer Gesäßmuskel","Schultern","Oberschenkelvorderseite"],"setup":"Leg eine Matte hin und stütz dich auf die Unterarme, Ellbogen unter den Schultern.","steps":["Streck die Beine nach hinten und stell die Zehen auf.","Spann Bauch, Po und Oberschenkel an.","Heb den Körper an, bis er eine gerade Linie vom Kopf bis zu den Fersen bildet.","Halte die Position und atme ruhig weiter."],"cues":["Gerade Linie von Kopf bis Ferse.","Po anspannen.","Weiteratmen."],"mistakes":["Hüfte hängt durch.","Po zu hoch.","Schultern hochziehen."],"variants":[{"name":"Seitstütz","effect":"Mehr Arbeit für die schrägen Bauchmuskeln und den mittleren Gesäßmuskel."},{"name":"Auf instabiler Unterlage","effect":"Die Rumpfmuskeln sind im Mittel etwas aktiver als auf festem Boden."}],"sources":["https://www.acefitness.org/resources/everyone/exercise-library/32/front-plank/"],"studies":2,"img":1},{"id":"beinheben","name":"Beinheben hängend / im Stütz","aliases":["Hanging Leg Raise","Knee Raise","Captain's Chair"],"kind":"Körpergewicht","muscle":"Bauch","primary":["Gerader Bauchmuskel","Hüftbeuger"],"secondary":["Schräge Bauchmuskeln","Unterarme (beim Hängen)","Breiter Rückenmuskel (Stabilisierung)"],"setup":"Stütz dich im Beinheben-Gerät mit den Unterarmen auf die Polster oder häng dich an eine Stange.","steps":["Spann den Bauch an und lass die Beine locker hängen.","Zieh die Knie nach oben Richtung Brust.","Roll das Becken am Ende leicht ein, sodass der Po nach vorn kommt.","Senk die Beine langsam ab, ohne zu schwingen."],"cues":["Becken einrollen, nicht nur Beine heben.","Kein Schwung.","Langsam runter."],"mistakes":["Mit Schwung arbeiten.","Nur die Beine heben, ohne das Becken einzurollen.","Ins Hohlkreuz fallen."],"variants":[{"name":"Knie gebeugt (Knee Raise)","effect":"Kürzerer Hebel und leichter; hängend mit Schlaufen zeigte das sehr hohe Bauchaktivität."},{"name":"Beine gestreckt","effect":"Langer Hebel und schwerer; die Hüftbeuger müssen deutlich mehr mitarbeiten."},{"name":"Knie zur Seite ziehen","effect":"Mehr Arbeit für die schrägen Bauchmuskeln."}],"sources":[],"studies":2,"img":1},{"id":"laufband","name":"Laufband","aliases":["Treadmill","Gehen","Joggen"],"kind":"Cardio","muscle":"Ganzkörper","warm":{"mode":"zeit","def":5,"focus":"alle"},"primary":["Oberschenkelvorderseite (Quadrizeps)","Waden"],"secondary":["Großer Gesäßmuskel","Beinbeuger"],"setup":"Starte mit flottem Gehen (etwa 5 bis 6 km/h). Wer mag, stellt 2 bis 5 Prozent Steigung ein.","steps":["Steig auf das Band und starte langsam.","Steigere das Tempo nach 1 Minute, bis du leicht schneller atmest.","Bleib 4 bis 5 Minuten in diesem Tempo, ohne außer Atem zu kommen.","Reduziere am Ende kurz das Tempo und steig erst aus, wenn das Band steht."],"cues":["Du solltest noch in ganzen Sätzen sprechen können.","Aufrecht gehen, Hände nur zum Sichern an die Griffe."],"mistakes":["Zu schnell starten und schon vor dem Training müde sein.","Sich die ganze Zeit an den Griffen festhalten."],"variants":[{"name":"Gehen mit Steigung","effect":"Wärmt Po und Waden etwas stärker auf und schont die Gelenke mehr als Joggen."}],"img":1,"sources":["https://www.scienceforsport.com/warm-ups/","https://pubmed.ncbi.nlm.nih.gov/29063454/","https://pure.northampton.ac.uk/en/publications/acute-effects-of-muscle-stretching-on-physical-performance-range-/"],"studies":0},{"id":"crosstrainer","name":"Crosstrainer","aliases":["Elliptical","Ellipsentrainer"],"kind":"Cardio","muscle":"Ganzkörper","warm":{"mode":"zeit","def":5,"focus":"alle"},"primary":["Oberschenkelvorderseite (Quadrizeps)","Großer Gesäßmuskel"],"secondary":["Beinbeuger","Waden","Brust","Breiter Rückenmuskel"],"setup":"Wähle einen niedrigen Widerstand, mit dem du locker 5 Minuten durchhältst.","steps":["Stell dich mit beiden Füßen ganz auf die Pedale und greif die beweglichen Griffe.","Beginne langsam und finde einen gleichmäßigen Rhythmus.","Drück und zieh die Griffe aktiv mit, damit Arme und Oberkörper warm werden.","Steigere nach 1 bis 2 Minuten leicht den Widerstand oder das Tempo."],"cues":["Fersen bleiben auf den Pedalen.","Leicht schneller atmen, nicht außer Atem."],"mistakes":["Nur auf den Zehen stehen.","Den Oberkörper auf die Griffe stützen."],"variants":[{"name":"Rückwärts treten","effect":"Die Oberschenkelvorderseite arbeitet etwas mehr, gut vor Beintagen."}],"img":1,"sources":["https://www.scienceforsport.com/warm-ups/","https://pubmed.ncbi.nlm.nih.gov/29063454/","https://pure.northampton.ac.uk/en/publications/acute-effects-of-muscle-stretching-on-physical-performance-range-/"],"studies":0},{"id":"ergometer","name":"Fahrrad-Ergometer","aliases":["Fahrrad","Bike","Spinning"],"kind":"Cardio","muscle":"Beine","warm":{"mode":"zeit","def":5,"focus":"unter"},"primary":["Oberschenkelvorderseite (Quadrizeps)"],"secondary":["Großer Gesäßmuskel","Beinbeuger","Waden"],"setup":"Stell den Sattel so hoch, dass dein Knie unten nur noch leicht gebeugt ist.","steps":["Setz dich auf den Sattel und stell die Füße mittig auf die Pedale.","Tritt mit leichtem Widerstand los.","Erhöhe nach 1 bis 2 Minuten den Widerstand so, dass du leicht schneller atmest.","Halte das 3 bis 4 Minuten und fahr kurz locker aus."],"cues":["Knie zeigen nach vorne, nicht nach innen.","Gleichmäßig runde Tritte."],"mistakes":["Sattel zu tief, dann drückt es auf die Knie.","Zu hoher Widerstand schon beim Aufwärmen."],"variants":[],"img":1,"sources":["https://www.scienceforsport.com/warm-ups/","https://pubmed.ncbi.nlm.nih.gov/29063454/","https://pure.northampton.ac.uk/en/publications/acute-effects-of-muscle-stretching-on-physical-performance-range-/"],"studies":0},{"id":"rudergeraet","name":"Rudergerät","aliases":["Rower","Rudern Cardio"],"kind":"Cardio","muscle":"Ganzkörper","warm":{"mode":"zeit","def":5,"focus":"alle"},"primary":["Oberschenkelvorderseite (Quadrizeps)","Breiter Rückenmuskel (Latissimus)"],"secondary":["Großer Gesäßmuskel","Beinbeuger","Bizeps","Hintere Schulter","Rückenstrecker"],"setup":"Füße fest in die Schlaufen, Widerstandsklappe auf eine niedrige Stufe (etwa 3 bis 5).","steps":["Setz dich, Knie gebeugt, Arme lang, Oberkörper leicht nach vorne.","Drück dich zuerst mit den Beinen weg.","Lehn dich dann leicht zurück und zieh den Griff zum unteren Brustkorb.","Zurück in umgekehrter Reihenfolge: Arme, Oberkörper, dann Beine."],"cues":["Beine, Oberkörper, Arme. Und zurück: Arme, Oberkörper, Beine.","Rücken gerade, Schultern locker."],"mistakes":["Nur mit den Armen ziehen.","Rücken rund machen."],"variants":[],"img":1,"sources":["https://www.scienceforsport.com/warm-ups/","https://pubmed.ncbi.nlm.nih.gov/29063454/","https://pure.northampton.ac.uk/en/publications/acute-effects-of-muscle-stretching-on-physical-performance-range-/"],"studies":0},{"id":"stepper","name":"Stepper / Treppensteiger","aliases":["Stairmaster","Stepper"],"kind":"Cardio","muscle":"Beine","warm":{"mode":"zeit","def":5,"focus":"unter"},"primary":["Großer Gesäßmuskel","Oberschenkelvorderseite (Quadrizeps)"],"secondary":["Waden","Beinbeuger"],"setup":"Wähle eine langsame Stufe, bei der du ohne Festhalten aufrecht steigen kannst.","steps":["Steig auf und halte dich anfangs leicht an den Griffen.","Steig mit ganzem Fuß auf jede Stufe.","Steigere das Tempo, bis du leicht schneller atmest.","Bleib aufrecht und lass die Griffe locker."],"cues":["Ganzer Fuß auf die Stufe.","Oberkörper aufrecht."],"mistakes":["Sich mit dem Oberkörper auf die Griffe hängen.","Nur auf den Zehenspitzen steigen."],"variants":[],"img":1,"sources":["https://www.scienceforsport.com/warm-ups/","https://pubmed.ncbi.nlm.nih.gov/29063454/","https://pure.northampton.ac.uk/en/publications/acute-effects-of-muscle-stretching-on-physical-performance-range-/"],"studies":0},{"id":"armkreisen","name":"Armkreisen","aliases":["Arm Circles"],"kind":"Mobilität","muscle":"Schultern","warm":{"mode":"wdh","def":10,"focus":"ober"},"primary":["Seitliche Schulter","Vordere Schulter","Hintere Schulter"],"secondary":["Trapezmuskel"],"setup":"Stell dich hüftbreit hin, Arme seitlich auf Schulterhöhe.","steps":["Mach mit gestreckten Armen kleine Kreise nach vorne.","Werde langsam größer, bis die Kreise groß und kontrolliert sind.","Wechsle nach 10 Kreisen die Richtung.","Zähl 10 Kreise pro Richtung als eine Runde."],"cues":["Langsam und kontrolliert, nicht schleudern.","Schultern weg von den Ohren."],"mistakes":["Hohlkreuz machen.","Arme mit Schwung schleudern."],"variants":[{"name":"Einzeln mit großen Kreisen","effect":"Mehr Bewegungsumfang für das Schultergelenk vor Drück- und Zugübungen."}],"img":1,"sources":["https://www.scienceforsport.com/warm-ups/","https://pubmed.ncbi.nlm.nih.gov/29063454/","https://pure.northampton.ac.uk/en/publications/acute-effects-of-muscle-stretching-on-physical-performance-range-/"],"studies":0},{"id":"bandpullapart","name":"Band Pull-Apart","aliases":["Band auseinanderziehen"],"kind":"Mobilität","muscle":"Rücken","warm":{"mode":"wdh","def":15,"focus":"ober"},"primary":["Hintere Schulter","Mittlerer Trapezmuskel"],"secondary":["Rautenmuskeln","Untergrätenmuskel (Infraspinatus)"],"setup":"Nimm ein leichtes Widerstandsband, Hände etwa schulterbreit.","steps":["Halte das Band mit gestreckten Armen vor der Brust.","Zieh die Hände seitlich auseinander, bis das Band die Brust berührt.","Drück dabei die Schulterblätter leicht zusammen.","Lass das Band langsam zurück."],"cues":["Arme fast gestreckt lassen.","Schultern tief halten."],"mistakes":["Zu starkes Band, dann zieht man mit Schwung.","Hohlkreuz machen."],"variants":[{"name":"Untergriff","effect":"Die Schulter dreht etwas mehr nach außen, gut vor Drückübungen."}],"img":1,"sources":["https://www.scienceforsport.com/warm-ups/","https://pubmed.ncbi.nlm.nih.gov/29063454/","https://pure.northampton.ac.uk/en/publications/acute-effects-of-muscle-stretching-on-physical-performance-range-/"],"studies":0},{"id":"katzekuh","name":"Katze-Kuh","aliases":["Cat Cow","Katzenbuckel"],"kind":"Mobilität","muscle":"Rücken","warm":{"mode":"wdh","def":8,"focus":"alle"},"primary":["Rückenstrecker"],"secondary":["Gerader Bauchmuskel"],"setup":"Geh in den Vierfüßlerstand, Hände unter den Schultern, Knie unter der Hüfte.","steps":["Mach beim Ausatmen den Rücken rund und lass den Kopf hängen.","Senk beim Einatmen den Bauch und heb Brust und Blick leicht.","Beweg dich langsam Wirbel für Wirbel.","Eine runde und eine hohle Position zählen als eine Wiederholung."],"cues":["Langsam und mit dem Atem.","Nur so weit, wie es angenehm ist."],"mistakes":["Mit Schwung bewegen.","Nur den Nacken bewegen statt der ganzen Wirbelsäule."],"variants":[],"img":1,"sources":["https://www.scienceforsport.com/warm-ups/","https://pubmed.ncbi.nlm.nih.gov/29063454/","https://pure.northampton.ac.uk/en/publications/acute-effects-of-muscle-stretching-on-physical-performance-range-/"],"studies":0},{"id":"hueftkreisen","name":"Hüftkreisen im Stand","aliases":["Hip Circles"],"kind":"Mobilität","muscle":"Po","warm":{"mode":"wdh","def":8,"focus":"unter"},"primary":["Mittlerer Gesäßmuskel","Hüftbeuger"],"secondary":["Adduktoren","Großer Gesäßmuskel"],"setup":"Halte dich mit einer Hand an einer Stange oder Wand fest.","steps":["Steh auf einem Bein und heb das andere Knie auf Hüfthöhe.","Führ das Knie in einem großen Kreis nach außen und wieder nach unten.","Mach 8 Kreise, dann 8 in die andere Richtung.","Wechsle das Bein. Die Wiederholungen gelten pro Bein und Richtung."],"cues":["Oberkörper bleibt ruhig und aufrecht.","Großer, langsamer Kreis."],"mistakes":["Mit dem Oberkörper mitkippen.","Zu schnell kreisen."],"variants":[],"img":1,"sources":["https://www.scienceforsport.com/warm-ups/","https://pubmed.ncbi.nlm.nih.gov/29063454/","https://pure.northampton.ac.uk/en/publications/acute-effects-of-muscle-stretching-on-physical-performance-range-/"],"studies":0},{"id":"glutebridge","name":"Glute Bridge (ohne Gewicht)","aliases":["Beckenheben","Hüftbrücke"],"kind":"Mobilität","muscle":"Po","warm":{"mode":"wdh","def":12,"focus":"unter"},"primary":["Großer Gesäßmuskel"],"secondary":["Beinbeuger","Rückenstrecker"],"setup":"Leg dich auf den Rücken, Knie gebeugt, Füße hüftbreit flach auf dem Boden.","steps":["Spann den Bauch leicht an.","Drück dich über die Fersen hoch, bis Knie, Hüfte und Schultern eine Linie bilden.","Halte oben 1 Sekunde und spann den Po fest an.","Senk die Hüfte langsam ab."],"cues":["Über die Fersen drücken.","Oben den Po anspannen, nicht ins Hohlkreuz."],"mistakes":["Oben ins Hohlkreuz gehen.","Knie fallen nach innen."],"variants":[{"name":"Mit Miniband um die Knie","effect":"Der mittlere Gesäßmuskel arbeitet mehr mit, gut vor Hip Thrust und Kniebeugen."}],"img":1,"sources":["https://www.scienceforsport.com/warm-ups/","https://pubmed.ncbi.nlm.nih.gov/29063454/","https://pure.northampton.ac.uk/en/publications/acute-effects-of-muscle-stretching-on-physical-performance-range-/"],"studies":0},{"id":"kniebeugekg","name":"Kniebeuge ohne Gewicht","aliases":["Bodyweight Squat","Air Squat"],"kind":"Mobilität","muscle":"Beine","warm":{"mode":"wdh","def":10,"focus":"unter"},"primary":["Oberschenkelvorderseite (Quadrizeps)","Großer Gesäßmuskel"],"secondary":["Adduktoren","Rückenstrecker"],"setup":"Füße etwas mehr als hüftbreit, Zehen leicht nach außen.","steps":["Streck die Arme nach vorne oder verschränk sie vor der Brust.","Setz dich langsam nach hinten unten, als ob du dich auf einen Stuhl setzt.","Geh so tief, wie du mit geradem Rücken kommst.","Drück dich über den ganzen Fuß wieder hoch."],"cues":["Knie zeigen in Richtung Zehen.","Fersen bleiben am Boden."],"mistakes":["Knie fallen nach innen.","Rücken wird unten rund."],"variants":[{"name":"Unten 2 Sekunden halten","effect":"Mehr Beweglichkeit in Hüfte und Sprunggelenk vor schweren Beinübungen."}],"img":1,"sources":["https://www.scienceforsport.com/warm-ups/","https://pubmed.ncbi.nlm.nih.gov/29063454/","https://pure.northampton.ac.uk/en/publications/acute-effects-of-muscle-stretching-on-physical-performance-range-/"],"studies":0},{"id":"worldsgreatest","name":"World’s Greatest Stretch","aliases":["Ausfallschritt mit Drehung"],"kind":"Mobilität","muscle":"Ganzkörper","warm":{"mode":"wdh","def":5,"focus":"alle"},"primary":["Hüftbeuger","Großer Gesäßmuskel"],"secondary":["Beinbeuger","Adduktoren","Rückenstrecker","Schräge Bauchmuskeln"],"setup":"Du brauchst etwa 2 Meter Platz am Boden.","steps":["Mach einen großen Ausfallschritt nach vorne und setz beide Hände innen neben den vorderen Fuß.","Bring den Ellbogen der Innenseite Richtung Fußknöchel.","Dreh dann den Oberkörper auf und streck diesen Arm Richtung Decke.","Komm zurück, wechsle die Seite. Die Wiederholungen gelten pro Seite."],"cues":["Hinteres Bein lang lassen.","Langsam aufdrehen und kurz halten."],"mistakes":["Hüfte hängt durch.","Mit Schwung drehen."],"variants":[],"img":1,"sources":["https://www.scienceforsport.com/warm-ups/","https://pubmed.ncbi.nlm.nih.gov/29063454/","https://pure.northampton.ac.uk/en/publications/acute-effects-of-muscle-stretching-on-physical-performance-range-/"],"studies":0},{"id":"inchworm","name":"Inchworm","aliases":["Raupe","Walk-out"],"kind":"Mobilität","muscle":"Ganzkörper","warm":{"mode":"wdh","def":5,"focus":"alle"},"primary":["Beinbeuger","Vordere Schulter"],"secondary":["Gerader Bauchmuskel","Brust","Trizeps"],"setup":"Stell dich aufrecht hin, Füße hüftbreit.","steps":["Beug dich aus der Hüfte nach vorne und setz die Hände vor den Füßen auf.","Lauf mit den Händen nach vorne, bis du in der Liegestütz-Position bist.","Lauf mit den Händen wieder zurück zu den Füßen.","Richte dich auf. Das ist eine Wiederholung."],"cues":["Knie nur so weit beugen wie nötig.","In der Liegestütz-Position Bauch anspannen."],"mistakes":["Hüfte hängt in der Liegestütz-Position durch.","Zu große Schritte mit den Händen."],"variants":[],"img":1,"sources":["https://www.scienceforsport.com/warm-ups/","https://pubmed.ncbi.nlm.nih.gov/29063454/","https://pure.northampton.ac.uk/en/publications/acute-effects-of-muscle-stretching-on-physical-performance-range-/"],"studies":0},{"id":"monsterwalk","name":"Monster Walk mit Miniband","aliases":["Band Walk","Seitliches Gehen mit Band"],"kind":"Mobilität","muscle":"Po","warm":{"mode":"wdh","def":10,"focus":"unter"},"primary":["Mittlerer Gesäßmuskel"],"secondary":["Großer Gesäßmuskel","Spanner der Oberschenkelbinde (TFL)"],"setup":"Leg ein leichtes Miniband um die Knie oder knapp über die Knöchel.","steps":["Geh leicht in die Knie, Füße hüftbreit, Spannung im Band.","Mach kleine Schritte zur Seite, ohne dass die Füße zusammenkommen.","Geh 10 Schritte nach rechts und 10 zurück nach links.","Halte die ganze Zeit Spannung im Band."],"cues":["Knie drücken leicht nach außen.","Oberkörper bleibt ruhig."],"mistakes":["Füße schlagen zusammen, Band wird locker.","Mit dem Oberkörper hin und her schaukeln."],"variants":[{"name":"Vorwärts diagonal","effect":"Ähnlicher Effekt, etwas mehr Gesäß, gut als Abwechslung."}],"img":1,"sources":["https://www.scienceforsport.com/warm-ups/","https://pubmed.ncbi.nlm.nih.gov/29063454/","https://pure.northampton.ac.uk/en/publications/acute-effects-of-muscle-stretching-on-physical-performance-range-/"],"studies":0}]/*/LIB*/;

// Deutsche Muskelnamen aus der Bibliothek → Flächen der Körpergrafik
const MKEY=[[/adduktor|kammmuskel|gracilis/,['adductor','abductors']],[/beinbeuger|hamstring/,['hamstring']],[/brachialis|bizeps/,['biceps']],[/unterarm|brachioradialis/,['forearm']],
  [/latissimus|breiter rücken|rundmuskel|rautenmuskel|oberer rücken|untergräten/,['upper-back']],[/schräge bauch/,['obliques']],[/bauch/,['abs']],[/rumpf/,['abs','obliques']],
  [/brust/,['chest']],[/gesäß|tfl|oberschenkelbinde/,['gluteal']],[/hintere schulter/,['back-deltoids']],[/vordere schulter/,['front-deltoids']],[/seitliche schulter|^schultern/,['front-deltoids','back-deltoids']],
  [/trapez/,['trapezius']],[/oberschenkelvorderseite|quadrizeps/,['quadriceps']],[/rückenstrecker/,['lower-back']],[/trizeps/,['triceps']],[/soleus/,['left-soleus','right-soleus']],[/wade|gastrocnemius/,['calves']]];
const GROUPKEY={Beine:['quadriceps','hamstring','calves'],Po:['gluteal'],Rücken:['upper-back','lower-back','trapezius'],Brust:['chest'],Schultern:['front-deltoids','back-deltoids'],Arme:['biceps','triceps'],Bauch:['abs','obliques'],Ganzkörper:['quadriceps','gluteal','upper-back','chest']};
function mkeys(names){const out=new Set();(names||[]).forEach(n=>{const x=n.toLowerCase();for(const [re,k] of MKEY)if(re.test(x)){k.forEach(y=>out.add(y));break}});return out}
const NEUTRAL=new Set(['head','neck','knees']);
// Grafik: Hauptmuskeln kräftig, mitarbeitende Muskeln hell, Rest neutral
function bodyMap(prim,sec,opt){opt=opt||{};const fig=side=>'<svg viewBox="0 0 100 200" class="fig" role="img" aria-label="'+(side==='front'?'Vorderseite':'Rückseite')+'">'+BODY[side].map(([m,pts])=>{
    const c=prim.has(m)?'p':sec&&sec.has(m)?'s':NEUTRAL.has(m)?'n':'b';return pts.map(pt=>'<polygon class="'+c+'" points="'+pt+'"/>').join('')}).join('')+'</svg>';
  return '<div class="bodymap'+(opt.hero?' onhero':'')+'"><figure>'+fig('front')+(opt.labels?'<figcaption>Vorne</figcaption>':'')+'</figure><figure>'+fig('back')+(opt.labels?'<figcaption>Hinten</figcaption>':'')+'</figure></div>'}
function planKeys(p){const k=new Set();p.items.forEach(it=>{const e=exById(it.exId),L=libOf(e);(L?mkeys(L.primary):new Set(GROUPKEY[e&&e.muscle]||[])).forEach(x=>k.add(x))});return k}
function ring(n,t){const r=42,c=2*Math.PI*r,f=t?n/t:0;return '<svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="'+r+'" class="trk"/><circle cx="50" cy="50" r="'+r+'" class="val" stroke-dasharray="'+(c*f).toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 50 50)"/><text x="50" y="50" class="rn">'+n+'</text><text x="50" y="68" class="rt">von '+t+' Sätzen</text></svg>'}
const libOf=e=>e&&e.lib?libById(e.lib):null;
const norm=x=>String(x||'').toLowerCase().replace(/[^a-zäöüß0-9]/g,'');
function libMatch(name){const n=norm(name);return LIB.find(l=>norm(l.name)===n||(l.aliases||[]).some(a=>norm(a)===n))}

function rng(seed){return()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296}}
function makeSample(){
  const ex=[
    ['beinpresse','Beinpresse','Maschine','Beine','Sitz 3 · Füße mittig',60,5],
    ['hipthrust','Hip Thrust Maschine','Maschine','Po','Polster auf Hüfte, Stufe 2',40,5],
    ['rdl','Rumänisches Kreuzheben','Freihantel','Beine','Langhantel, Rücken gerade',30,2.5],
    ['beinbeuger','Beinbeuger sitzend','Maschine','Beine','Lehne 4 · Polster über Knöchel',25,2.5],
    ['abduktor','Abduktoren','Maschine','Po','Startweite 2',35,5],
    ['beinstrecker','Beinstrecker','Maschine','Beine','Lehne 3',25,2.5],
    ['latzug','Latzug','Kabel','Rücken','Kniepolster 3 · breiter Griff',30,2.5],
    ['rudern','Rudern sitzend','Kabel','Rücken','V-Griff',30,2.5],
    ['brustpresse','Brustpresse','Maschine','Brust','Sitz 5 · Griffe auf Brusthöhe',20,2.5],
    ['schulterpresse','Schulterpresse','Maschine','Schultern','Sitz 4',15,2.5],
    ['seitheben','Seitheben','Freihantel','Schultern','Kurzhanteln',4,1],
    ['bizeps','Bizeps Curls','Freihantel','Arme','Kurzhanteln, Gewicht je Seite',7,1],
    ['trizeps','Trizepsdrücken am Kabel','Kabel','Arme','Seilgriff',12.5,2.5]
  ].map(([id,name,kind,muscle,setting,base,step])=>({id,name,kind,muscle,setting,step,note:'',base}));
  const P=(id,name,items)=>({id,name,items:items.map(([exId,sets,repMin,repMax,rest])=>({exId,sets,repMin,repMax,rest:rest||90}))});
  const plans=[
    P('p_ober','Oberkörper',[['latzug',3,8,12],['brustpresse',3,8,12],['rudern',3,8,12],['schulterpresse',3,8,12],['seitheben',2,12,15,60],['bizeps',2,10,12,60],['trizeps',2,10,12,60]]),
    P('p_unter','Unterkörper',[['beinpresse',3,8,12,120],['hipthrust',3,8,12,120],['rdl',3,8,10,120],['beinbeuger',3,10,12],['abduktor',2,12,15,60]]),
    P('p_ganz','Ganzkörper',[['beinpresse',3,8,12,120],['latzug',3,8,12],['brustpresse',3,8,12],['hipthrust',3,8,12],['rudern',3,8,12],['beinstrecker',2,12,15,60]])
  ];
  const schedule={2:'p_ober',4:'p_unter',6:'p_ganz'};
  const r=rng(42), sessions=[], body=[], now=new Date(); now.setHours(0,0,0,0);
  const exMap=Object.fromEntries(ex.map(e=>[e.id,e]));
  for(let i=63;i>=1;i--){
    const d=addDays(now,-i), pid=schedule[d.getDay()];
    if(i%3===0) body.push({date:ymd(d),kg:Math.round((64.2-(63-i)*0.012+(r()-.5)*.6)*10)/10});
    if(!pid||r()>.9) continue;
    const plan=plans.find(p=>p.id===pid), el=63-i;
    const entries=plan.items.map(it=>{
      const e=exMap[it.exId], k=Math.floor(el/14), phase=(el%14)/14;
      const w=Math.round((e.base+e.step*k)*10)/10;
      const sets=[];
      for(let s=0;s<it.sets;s++){
        let reps=it.repMin+Math.round(phase*(it.repMax-it.repMin))-(s===it.sets-1&&r()<.5?1:0);
        sets.push({w,r:Math.max(it.repMin-1,Math.min(it.repMax,reps)),done:true});
      }
      return {exId:it.exId,sets};
    });
    const start=17+Math.floor(r()*3);
    sessions.push({id:uid(),date:ymd(d),planId:pid,name:plan.name,start:pad(start)+':'+(r()<.5?'15':'40'),minutes:45+Math.round(r()*25),feel:3+Math.floor(r()*3),entries,note:''});
  }
  ex.forEach(e=>{delete e.base;if(libById(e.id))e.lib=e.id});
  return {v:1,sample:true,settings:{goal:3,rest:90,sound:true,lastBackup:null,bodyHome:true},exercises:ex,plans,schedule,planned:[],sessions,body,active:null};
}

const exById=id=>S.exercises.find(e=>e.id===id);
const isWarm=e=>!!e&&WARMK.includes(e.kind);

const warmEx=()=>S.exercises.filter(e=>!e.archived&&isWarm(e));
// Aufwärmen: Cardio in Minuten (plus Stufe/Tempo als Text), Mobilität in Wiederholungen
const warmMode=e=>{const L=libOf(e);return L&&L.warm?L.warm.mode:(e&&e.kind==='Cardio'?'zeit':'wdh')};
const warmDef=e=>{const L=libOf(e);return L&&L.warm?L.warm.def:(warmMode(e)==='zeit'?5:10)};
const fmtWarm=w=>{const e=exById(w.exId)||{name:'?'};return e.name+' '+nf(w.val)+(w.mode==='zeit'?' Min.':' Wdh.')+(w.level?' ('+w.level+')':'')};
// Vorschlag nach RAMP-Prinzip: erst Puls hoch (Cardio), dann 2 bis 3 Übungen für die Muskeln des Plans
function defaultWarm(p){
  const k=planKeys(p),low=['quadriceps','hamstring','gluteal','calves','adductor'].some(x=>k.has(x)),up=['chest','upper-back','front-deltoids','back-deltoids','biceps','triceps','trapezius'].some(x=>k.has(x));
  const ids=['laufband'].concat(low&&up?['worldsgreatest','glutebridge','armkreisen']:low?['hueftkreisen','glutebridge','kniebeugekg']:up?['armkreisen','bandpullapart','katzekuh']:['katzekuh','worldsgreatest']);
  return ids.map(id=>S.exercises.find(e=>e.lib===id&&!e.archived)).filter(Boolean).map(e=>({exId:e.id,val:warmDef(e)}))}
function warmHistory(exId){return sorted().flatMap(s=>(s.warmup||[]).filter(w=>w.exId===exId).map(w=>Object.assign({date:s.date},w)))}
const planById=id=>S.plans.find(p=>p.id===id);
const sorted=()=>S.sessions.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.start||'')<(b.start||'')?-1:1);
const sessVolume=s=>s.entries.reduce((a,e)=>a+work(e.sets).reduce((b,x)=>b+(x.w||0)*(x.r||0),0),0);
function lastEntry(exId,before){
  const ss=sorted().reverse();
  for(const s of ss){if(before&&s.date>=before)continue;const e=s.entries.find(e=>e.exId===exId);if(e&&work(e.sets).length)return {session:s,entry:e}}
  return null;
}
function history(exId){
  return sorted().map(s=>{const e=s.entries.find(e=>e.exId===exId);const ws=e?work(e.sets):[];if(!ws.length)return null;
    const top=Math.max(...ws.map(x=>x.w||0));const best=Math.max(...ws.map(x=>e1rm(x.w||0,x.r||0)));
    return {date:s.date,sets:ws,top,best,vol:ws.reduce((a,x)=>a+(x.w||0)*(x.r||0),0)}}).filter(Boolean);
}
function prEvents(){
  const best={},out=[];
  for(const s of sorted()) for(const e of s.entries){
    const ws=work(e.sets);if(!ws.length)continue;
    const b=Math.max(0,...ws.map(x=>e1rm(x.w||0,x.r||0)));
    if(b===0)continue;
    const top=ws.reduce((m,x)=>(x.w||0)>(m.w||0)||((x.w||0)===(m.w||0)&&(x.r||0)>(m.r||0))?x:m,{});
    if(best[e.exId]!==undefined&&b>best[e.exId]+.01) out.push({date:s.date,exId:e.exId,e1:b,w:top.w,r:top.r});
    if(best[e.exId]===undefined||b>best[e.exId])best[e.exId]=b;
  }
  return out;
}
const fmtSets=sets=>{
  sets=work(sets);if(!sets.length)return 'nur Aufwärmsätze';
  const groups=[];sets.forEach(x=>{const g=groups[groups.length-1];if(g&&g.w===x.w&&g.r===x.r)g.n++;else groups.push({w:x.w,r:x.r,n:1})});
  return groups.map(g=>(g.n>1?g.n+'×':'')+g.r+(g.w?'\u00a0@\u00a0'+nf(g.w)+'\u00a0kg':'\u00a0Wdh.')).join(', ');
};
function suggestion(exId,item){
  const ex=exById(exId), last=lastEntry(exId);
  if(!last) return {w:null,r:item?item.repMin:10,text:'Noch keine Daten. Starte locker und taste dich ran.'};
  const sets=work(last.entry.sets), top=Math.max(...sets.map(x=>x.w||0)), topSets=sets.filter(x=>x.w===top);
  const repMax=item?item.repMax:12, repMin=item?item.repMin:8;
  const allHit=topSets.every(x=>(x.r||0)>=repMax);
  const lastTxt='Letztes Mal ('+fmtDate(last.session.date)+'): <b>'+esc(fmtSets(sets))+'</b>';
  if(allHit&&(!top||(ex&&ex.kind==='Körpergewicht'))) return {w:top,r:repMax,text:lastTxt+'<br>Obere Grenze geschafft. Schwerere Variante oder Zusatzgewicht probieren.'};
  if(allHit) return {w:Math.round((top+(ex?ex.step:2.5))*10)/10,r:repMin,text:lastTxt+'<br>Alle Sätze bei '+repMax+' Wdh. geschafft. Heute <b>'+nf(top+(ex?ex.step:2.5))+' kg</b> probieren.'};
  const maxR=Math.max(...topSets.map(x=>x.r||0));
  return {w:top,r:Math.min(repMax,maxR+1),text:lastTxt+'<br>Gleiches Gewicht, Ziel: eine Wiederholung mehr als letztes Mal.'};
}

/* ---------- Charts ---------- */
function barChart(vals,labels,fmt){
  const W=340,H=150,pl=8,pr=8,pt=24,pb=24,max=Math.max(1,...vals),bw=(W-pl-pr)/vals.length;
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Wochenvolumen">';
  s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'" stroke="var(--line)"/>';
  vals.forEach((v,i)=>{
    const h=(H-pt-pb)*v/max, x=pl+i*bw+bw*.18, last=i===vals.length-1;
    s+='<rect x="'+x+'" y="'+(H-pb-h)+'" width="'+(bw*.64)+'" height="'+Math.max(h,v?2:0)+'" rx="4" fill="'+(last?'var(--plate)':'var(--muted)')+'" fill-opacity="'+(last?1:.28)+'"/>';
    s+='<text x="'+(x+bw*.32)+'" y="'+(H-6)+'" text-anchor="middle">'+labels[i]+'</text>';
    if(last||v===max) s+='<text class="lbl" x="'+(x+bw*.32)+'" y="'+(H-pb-h-6)+'" text-anchor="middle">'+fmt(v)+'</text>';
  });
  return s+'</svg>';
}
function lineChart(pts,opts){

  const W=340,H=170,pl=36,pr=12,pt=14,pb=24;
  const ys=pts.flatMap(p=>[p.a,p.b].filter(v=>v!=null));
  let lo=Math.min(...ys),hi=Math.max(...ys);const padv=(hi-lo)*.15||2;lo=Math.max(0,lo-padv);hi=hi+padv;
  const X=i=>pl+(W-pl-pr)*i/(pts.length-1), Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opts.label)+'">';
  for(let k=0;k<=2;k++){const v=lo+(hi-lo)*k/2;s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)" stroke-dasharray="'+(k?'3 4':'0')+'"/><text x="'+(pl-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+nf(v,0)+'</text>'}
  const path=key=>pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p[key]).toFixed(1)).join(' ');
  s+='<path d="'+path('a')+' L'+X(pts.length-1)+' '+(H-pb)+' L'+pl+' '+(H-pb)+'Z" fill="var(--plate)" fill-opacity=".08"/>';
  if(opts.b) s+='<path d="'+path('b')+'" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>';
  s+='<path d="'+path('a')+'" fill="none" stroke="var(--plate)" stroke-width="2.5" stroke-linejoin="round"/>';
  const li=pts.length-1;
  s+='<circle cx="'+X(li)+'" cy="'+Y(pts[li].a)+'" r="5" fill="var(--plate)" stroke="var(--surface)" stroke-width="2"/>';
  s+='<text x="'+pl+'" y="'+(H-6)+'">'+esc(opts.x0)+'</text><text x="'+(W-pr)+'" y="'+(H-6)+'" text-anchor="end">'+esc(opts.x1)+'</text>';

function spark(vals){
  if(vals.length<2)return '';

function buildEntry(exId,item){
  const sg=suggestion(exId,item), n=item?item.sets:3;
  return {exId,target:item?{sets:item.sets,repMin:item.repMin,repMax:item.repMax}:null,rest:item?item.rest:S.settings.rest,hint:sg.text,
    sets:Array.from({length:n},()=>({w:sg.w,r:sg.r,done:false}))};
}
function activeMin(A){const now=A.pausedAt||Date.now();return Math.max(0,Math.round((now-A.startTs-(A.pausedMs||0))/60000))}
function elapsedTxt(){const A=S.active;if(!A)return '';const m=activeMin(A);return (A.pausedAt?'Pausiert · ':'Seit '+A.start+' Uhr · ')+(m<60?m+' Min.':Math.floor(m/60)+' Std. '+(m%60)+' Min.')}
function sessionMd(s){
  const lines=['---','datum: '+s.date,'training: "'+s.name.replace(/"/g,"'")+'"','dauer_min: '+(s.minutes||''),'volumen_kg: '+Math.round(sessVolume(s)),(s.feel?'gefuehl: '+s.feel:null),'tags: [gym]','---','','# '+s.name+' · '+fmtDate(s.date),'','| Übung | Sätze |','|---|---|'].filter(x=>x!==null);
  s.entries.forEach(e=>lines.push('| '+((exById(e.exId)||{name:'?'}).name)+' | '+fmtSets(e.sets)+' |'));
  if(s.warmup&&s.warmup.length)lines.push('','Aufwärmen: '+s.warmup.map(fmtWarm).join(', '));
  if(s.note)lines.push('','> '+s.note.replace(/\n/g,'\n> '));
  return lines.join('\n');
}
function csvAll(){
  const q=v=>{v=String(v??'');return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const rows=[['Datum','Start','Training','Übung','Muskel','Satz','Aufwärmen','Gewicht (kg)','Wiederholungen','Dauer (Min.)','Gefühl','Aufwärm-Minuten','Stufe']];
  sorted().forEach(s=>{(s.warmup||[]).forEach(w=>{const ex=exById(w.exId)||{};rows.push([s.date,s.start||'',s.name,ex.name||'',ex.kind||'','','ja','',w.mode==='zeit'?'':w.val,s.minutes||'',s.feel||'',w.mode==='zeit'?String(w.val).replace('.',','):'',w.level||''])});
    s.entries.forEach(e=>{const ex=exById(e.exId)||{};e.sets.forEach((x,i)=>rows.push([s.date,s.start||'',s.name,ex.name||'',ex.muscle||'',i+1,x.wu?'ja':'',String(x.w??'').replace('.',','),x.r??'',s.minutes||'',s.feel||'','','']))})});
  return rows.map(r=>r.map(q).join(';')).join('\n');
}

async function saveFile(name,text,type){
  try{const file=new File([text],name,{type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return true}catch(e){if(e&&e.name==='AbortError')return false}}
    const u=URL.createObjectURL(file);const l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);return true}
  catch(e){return false}
}

function plateHtml(total,bar){
  const sizes=[25,20,15,10,5,2.5,1.25],col={25:'#E0283C',20:'#3A63E0',15:'#F2C230',10:'#2FA86A',5:'#F4F4F4',2.5:'#9AA3B2',1.25:'#C9CED8'},h={25:96,20:96,15:88,10:76,5:58,2.5:48,1.25:40};
  if(total==null||total<bar)return '<p class="muted">Gib ein Gesamtgewicht ab '+nf(bar)+' kg ein.</p>';
  let side=Math.round((total-bar)/2*100)/100;const used=[];
